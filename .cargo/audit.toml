# Acknowledged advisories for transitive dependencies.
#
# All entries below are pulled in by `litesvm` or the `solana-*` crate graph.
# They are unmaintained-crate warnings or unsoundness that does not apply to
# our use case (local simulation tool, no network exposure, no custom loggers).
#
# Reviewed: 2026-04-12 (Phase 4 LiteSVM migration).

[advisories]
ignore = [
    # ansi_term 0.12.1 — unmaintained. Transitive dep of litesvm.
    "RUSTSEC-2021-0139",

    # bincode 1.3.3 — unmaintained. Transitive dep of solana-vote-program
    # and solana-zk-token-sdk (both pulled by litesvm's solana-builtins).
    "RUSTSEC-2025-0141",

    # derivative 2.2.0 — unmaintained. Transitive dep of litesvm.
    "RUSTSEC-2024-0388",

    # paste 1.0.15 — unmaintained. Transitive dep of litesvm.
    "RUSTSEC-2024-0436",

    # rand — unsound with custom logger using rand::rng(). We do not use
    # custom loggers. Transitive dep of solana-sdk and litesvm.
    # Two advisory IDs for the same issue across rand versions.
    "RUSTSEC-2025-0026",
    "RUSTSEC-2026-0097",
]
