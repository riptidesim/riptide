<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Riptide Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-alt: #1c2430;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, 0.15);
      --danger: #f85149;
      --danger-soft: rgba(248, 81, 73, 0.15);
      --success: #3fb950;
      --warn: #d29922;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.masthead {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 18px 28px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    header.masthead h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header.masthead .brand {
      color: var(--accent);
      font-family: var(--mono);
    }
    header.masthead .tagline {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: auto;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 28px 64px;
    }
    section {
      margin-bottom: 32px;
    }
    section > h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin: 0 0 12px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .meta-cell {
      background: var(--surface);
      padding: 12px 16px;
    }
    .meta-cell .k {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .meta-cell .v {
      font-family: var(--mono);
      font-size: 14px;
      word-break: break-all;
    }
    table.kv {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    table.kv th,
    table.kv td {
      text-align: left;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    table.kv tr:last-child th,
    table.kv tr:last-child td { border-bottom: 0; }
    table.kv th {
      background: var(--surface-alt);
      color: var(--text-dim);
      font-weight: 500;
      width: 38%;
      font-family: var(--mono);
    }
    table.kv td {
      font-family: var(--mono);
    }
    table.kv tr.fire {
      background: var(--danger-soft);
    }
    table.kv tr.fire th,
    table.kv tr.fire td {
      color: var(--danger);
    }
    .chart-shell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      height: 360px;
      position: relative;
    }
    .chart-shell.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-style: italic;
      height: 120px;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .controls label {
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .controls select,
    .controls input {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .controls .count {
      margin-left: auto;
      color: var(--text-dim);
      font-size: 12px;
      font-family: var(--mono);
    }
    .events {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 480px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 12px;
    }
    .events table {
      width: 100%;
      border-collapse: collapse;
    }
    .events thead th {
      position: sticky;
      top: 0;
      background: var(--surface-alt);
      color: var(--text-dim);
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .events tbody td {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .events tbody tr:last-child td { border-bottom: 0; }
    .events .tick { color: var(--text-dim); width: 48px; }
    .events .agent { color: var(--accent); width: 120px; }
    .events .action { color: var(--text); font-weight: 500; width: 120px; }
    .events .outcome-success { color: var(--success); }
    .events .outcome-failed { color: var(--danger); }
    .events .outcome-skipped { color: var(--warn); }
    .events .params { color: var(--text-dim); }
    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 10px;
      font-size: 11px;
      padding: 2px 8px;
      margin-left: 8px;
    }
    .badge.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .empty-note {
      color: var(--text-dim);
      font-style: italic;
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      text-align: center;
    }
    .footer {
      color: var(--text-dim);
      font-size: 11px;
      text-align: center;
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .footer code { font-family: var(--mono); color: var(--text); }
  </style>
</head>
<body>
  <header class="masthead">
    <h1><span class="brand">riptide</span> dashboard</h1>
    <span id="runLabel" class="tagline">loading…</span>
  </header>
  <main>
    <section id="meta">
      <h2>Run metadata</h2>
      <div id="metaGrid" class="meta-grid"></div>
    </section>

    <section id="summary">
      <h2>Summary metrics</h2>
      <table class="kv" id="summaryTable">
        <tbody></tbody>
      </table>
    </section>

    <section id="invariants">
      <h2>Invariants <span id="invariantBadge"></span></h2>
      <div id="invariantBlock"></div>
    </section>

    <section id="timeseries">
      <h2>Timeseries</h2>
      <div class="controls">
        <label for="seriesSelect">Series</label>
        <select id="seriesSelect"></select>
      </div>
      <div id="chartShell" class="chart-shell"><canvas id="tsChart"></canvas></div>
    </section>

    <section id="events">
      <h2>Event stream</h2>
      <div class="controls">
        <label for="actionFilter">Action</label>
        <select id="actionFilter"><option value="">all</option></select>
        <label for="outcomeFilter">Outcome</label>
        <select id="outcomeFilter">
          <option value="">all</option>
          <option value="success">success</option>
          <option value="failed">failed</option>
          <option value="skipped">skipped</option>
        </select>
        <label for="agentFilter">Agent</label>
        <input id="agentFilter" placeholder="substring" />
        <span class="count" id="eventCount"></span>
      </div>
      <div class="events">
        <table>
          <thead>
            <tr><th>tick</th><th>agent</th><th>action</th><th>outcome</th><th>params</th></tr>
          </thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
    </section>

    <div class="footer">
      Served by <code>riptide --serve</code> · view raw: <a href="/api/result">/api/result</a> · <a href="/api/report">/api/report</a>
    </div>
  </main>

  <script>
    const FMT = new Intl.NumberFormat("en-US", { maximumFractionDigits: 6 });

    function fmtValue(v) {
      if (v === null || v === undefined) return "—";
      if (typeof v === "number") {
        if (!Number.isFinite(v)) return String(v);
        if (Number.isInteger(v)) return v.toLocaleString("en-US");
        return FMT.format(v);
      }
      if (typeof v === "boolean") return v ? "true" : "false";
      if (Array.isArray(v)) return `[${v.length} items]`;
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    function renderMeta(result) {
      const grid = document.getElementById("metaGrid");
      const rc = result.run_config || {};
      const personas = Array.isArray(rc.personas) ? rc.personas : [];
      const uniq = [...new Set(personas)];
      const cells = [
        ["scenario", rc.scenario ?? "—"],
        ["seed", result.seed ?? rc.seed ?? "—"],
        ["ticks", result.total_ticks ?? rc.ticks ?? "—"],
        ["agents", rc.agents ?? "—"],
        ["personas", uniq.length ? uniq.join(", ") : "—"],
        ["adapter output", rc.output_path ?? "—"]
      ];
      grid.innerHTML = cells
        .map(
          ([k, v]) =>
            `<div class="meta-cell"><div class="k">${k}</div><div class="v">${escapeHtml(String(v))}</div></div>`
        )
        .join("");
      document.getElementById("runLabel").textContent =
        `${rc.scenario ?? "run"} · seed ${result.seed ?? rc.seed ?? "?"} · ${result.total_ticks ?? "?"} ticks · ${rc.agents ?? "?"} agents`;
    }

    function renderSummary(result) {
      const tbody = document.querySelector("#summaryTable tbody");
      const summary = result.summary || {};
      const keys = Object.keys(summary).filter((k) => k !== "invariants_fired");
      keys.sort();
      if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" class="empty-note">summary is empty</td></tr>`;
        return;
      }
      tbody.innerHTML = keys
        .map((k) => `<tr><th>${escapeHtml(k)}</th><td>${escapeHtml(fmtValue(summary[k]))}</td></tr>`)
        .join("");
    }

    function renderInvariants(result) {
      const container = document.getElementById("invariantBlock");
      const badge = document.getElementById("invariantBadge");
      const rows = Array.isArray(result.summary && result.summary.invariants_fired)
        ? result.summary.invariants_fired
        : [];
      if (rows.length === 0) {
        container.innerHTML = `<div class="empty-note">No invariants declared by this adapter.</div>`;
        badge.innerHTML = "";
        return;
      }
      const firedCount = rows.filter((r) => (r.firings ?? 0) > 0).length;
      badge.innerHTML = firedCount > 0
        ? `<span class="badge danger">${firedCount} firing${firedCount === 1 ? "" : "s"}</span>`
        : `<span class="badge">${rows.length} clean</span>`;
      const body = rows
        .map((r) => {
          const fire = (r.firings ?? 0) > 0;
          return `<tr class="${fire ? "fire" : ""}"><th>${escapeHtml(r.name || "(unnamed)")}</th><td>${escapeHtml(r.field || "")} ${escapeHtml(r.op || "")} ${escapeHtml(fmtValue(r.value))} · fired ${r.firings ?? 0}</td></tr>`;
        })
        .join("");
      container.innerHTML = `<table class="kv"><tbody>${body}</tbody></table>`;
    }

    function pickNumericSeries(result) {
      const ts = Array.isArray(result.timeseries) ? result.timeseries : [];
      if (ts.length === 0) return [];
      const numericKeys = new Set();
      for (const row of ts) {
        for (const [k, v] of Object.entries(row)) {
          if (k === "tick") continue;
          if (typeof v === "number" && Number.isFinite(v)) numericKeys.add(k);
        }
      }
      return [...numericKeys].sort();
    }

    let tsChart = null;

    function renderTimeseries(result) {
      const ts = Array.isArray(result.timeseries) ? result.timeseries : [];
      const select = document.getElementById("seriesSelect");
      const shell = document.getElementById("chartShell");
      const keys = pickNumericSeries(result);
      if (ts.length === 0 || keys.length === 0) {
        shell.classList.add("empty");
        shell.innerHTML = "<span>No numeric timeseries available for this run.</span>";
        select.innerHTML = "";
        return;
      }
      select.innerHTML = keys
        .map((k) => `<option value="${escapeAttr(k)}">${escapeHtml(k)}</option>`)
        .join("");
      // Prefer "tvl" if present, else first.
      const preferred = keys.includes("tvl") ? "tvl" : keys[0];
      select.value = preferred;

      function draw(key) {
        const labels = ts.map((row) => row.tick);
        const data = ts.map((row) => (typeof row[key] === "number" ? row[key] : null));
        if (tsChart) {
          tsChart.data.labels = labels;
          tsChart.data.datasets[0].label = key;
          tsChart.data.datasets[0].data = data;
          tsChart.update();
          return;
        }
        const ctx = document.getElementById("tsChart").getContext("2d");
        tsChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: key,
                data,
                borderColor: "#58a6ff",
                backgroundColor: "rgba(88,166,255,0.12)",
                borderWidth: 2,
                pointRadius: 2,
                tension: 0.15,
                spanGaps: true
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { labels: { color: "#e6edf3" } }
            },
            scales: {
              x: {
                ticks: { color: "#8b949e" },
                grid: { color: "rgba(139,148,158,0.15)" },
                title: { display: true, text: "tick", color: "#8b949e" }
              },
              y: {
                ticks: { color: "#8b949e" },
                grid: { color: "rgba(139,148,158,0.15)" }
              }
            }
          }
        });
      }

      draw(preferred);
      select.onchange = () => draw(select.value);
    }

    function renderEvents(result) {
      const events = Array.isArray(result.events) ? result.events : [];
      const tbody = document.getElementById("eventsBody");
      const actionFilter = document.getElementById("actionFilter");
      const outcomeFilter = document.getElementById("outcomeFilter");
      const agentFilter = document.getElementById("agentFilter");
      const count = document.getElementById("eventCount");
      const actions = [...new Set(events.map((e) => e.action).filter(Boolean))].sort();
      actionFilter.innerHTML =
        `<option value="">all</option>` +
        actions.map((a) => `<option value="${escapeAttr(a)}">${escapeHtml(a)}</option>`).join("");

      function refresh() {
        const a = actionFilter.value;
        const o = outcomeFilter.value;
        const ag = agentFilter.value.trim().toLowerCase();
        const filtered = events.filter((ev) => {
          if (a && ev.action !== a) return false;
          if (o && ev.outcome !== o) return false;
          if (ag && !(ev.agent_id || "").toLowerCase().includes(ag)) return false;
          return true;
        });
        count.textContent = `${filtered.length} / ${events.length} events`;
        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-note">No events match the current filter.</td></tr>`;
          return;
        }
        // Cap rendering to 2000 rows for responsiveness; the source data is always linkable at /api/result.
        const slice = filtered.slice(0, 2000);
        tbody.innerHTML = slice
          .map((ev) => {
            const paramsText = ev.params ? JSON.stringify(ev.params) : "";
            return `<tr>
              <td class="tick">${ev.tick ?? ""}</td>
              <td class="agent">${escapeHtml(ev.agent_id || "")}</td>
              <td class="action">${escapeHtml(ev.action || "")}</td>
              <td class="outcome-${escapeAttr(ev.outcome || "")}">${escapeHtml(ev.outcome || "")}${ev.outcome_detail ? ` (${escapeHtml(ev.outcome_detail)})` : ""}</td>
              <td class="params">${escapeHtml(paramsText)}</td>
            </tr>`;
          })
          .join("") +
          (filtered.length > slice.length
            ? `<tr><td colspan="5" class="empty-note">…truncated at ${slice.length} of ${filtered.length} rows. See /api/result for the full stream.</td></tr>`
            : "");
      }

      actionFilter.onchange = refresh;
      outcomeFilter.onchange = refresh;
      agentFilter.oninput = refresh;
      refresh();
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }
    function escapeAttr(s) {
      return escapeHtml(s);
    }

    async function boot() {
      try {
        const res = await fetch("/api/result", { headers: { accept: "application/json" } });
        if (!res.ok) throw new Error(`/api/result returned ${res.status}`);
        const result = await res.json();
        renderMeta(result);
        renderSummary(result);
        renderInvariants(result);
        renderTimeseries(result);
        renderEvents(result);
      } catch (err) {
        document.querySelector("main").innerHTML =
          `<div class="empty-note" style="color:var(--danger);border-color:var(--danger)">Failed to load /api/result: ${escapeHtml(err && err.message ? err.message : String(err))}</div>`;
      }
    }

    boot();
  </script>
</body>
</html>
