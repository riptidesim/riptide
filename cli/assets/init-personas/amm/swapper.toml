# AMM persona — vanilla swapper.
#
#. Baseline user swapping tokens at a steady rate with no
# optimization. Half goes A→B, half goes B→A — the `direction` arg is
# fixed per-persona in the multi-arg binding, so half-and-half is
# expressed as two separate personas or as a weight over a single
# direction. ships the single-direction shape (direction = 0)
# and relies on the `sandwich-attacker` persona to drive B→A traffic;
# full directional mixing lives in if needed.
[personas.swapper]
label = "Vanilla swapper (A→B)"
action_rate_multiplier = 1.0
action_weights = { add_liquidity = 0.0, swap = 1.0, remove_liquidity = 0.0 }
triggers = [
  { if = "pool.fee_bps < 100", then = "swap", weight_boost = 1.2 },
]
persona_args = { amount_b = 0, direction = 0 }
