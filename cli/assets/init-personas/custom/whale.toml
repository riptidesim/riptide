persona_id = "whale"
persona_label = "Whale"
risk_tolerance = 0.95
action_rate_multiplier = 1.0
max_exposure = 0.98
triggers = []

# Outsized single-agent borrow. Fixed-amount sizing (not proportional)
# so per-tick borrow asks stay below the pool's per-call LTV cap and
# debt accumulates linearly over the pre-shock window. Repay/withdraw
# weights are zero so the whale holds the position into the shock
# instead of unwinding at the first sign of drawdown.
[action_weights]
deposit = 0.3
borrow = 1.0
withdraw = 0.0
repay = 0.0
liquidate = 0.0

[position_sizing]
strategy = "fixed"

[position_sizing.params]
amount = 800
