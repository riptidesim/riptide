<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riptide Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        /* Mirror of riptide-design-system/colors_and_type.css */
        --rt-ink: #070b11;
        --rt-deep-ocean: #0b141c;
        --rt-slate-panel: #121a24;
        --rt-slate-2: #17212e;
        --rt-slate-line: #1e2a38;
        --rt-slate-strong: #2a3b4e;
        --rt-signal-cyan: #22f0e6;
        --rt-teal: #14b8b6;
        --rt-teal-deep: #0e8a88;
        --rt-teal-ink: #082a2e;
        --rt-off-white: #e6eef2;
        --rt-fog: #aebdcb;
        --rt-fog-dim: #7a8a99;
        --rt-fog-faint: #4a5866;
        --rt-pass: #22c55e;
        --rt-pass-ink: #0b2416;
        --rt-fail: #ef4444;
        --rt-fail-ink: #2a0b0b;
        --rt-warn: #f5b041;
        --rt-info: var(--rt-signal-cyan);

        --rt-font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --rt-font-mono: "IBM Plex Mono", ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;

        --rt-focus-ring: 0 0 0 1px var(--rt-teal), 0 0 24px -2px rgba(34, 240, 230, 0.35);
        --rt-glow-soft: 0 0 48px -12px rgba(34, 240, 230, 0.45);

        --rt-track-label: 0.14em;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--rt-ink);
        color: var(--rt-off-white);
        font-family: var(--rt-font-sans);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      a { color: var(--rt-teal); text-decoration: none; }
      a:hover { color: var(--rt-signal-cyan); }
      button { font-family: inherit; }

      /* ==== App shell ==== */

      .rt-shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 56px 1fr;
        grid-template-areas:
          "topbar topbar"
          "side    main";
        height: 100vh;
        min-height: 0;
      }

      @media (max-width: 960px) {
        .rt-shell {
          grid-template-columns: 200px 1fr;
        }
      }
      @media (max-width: 1100px) {
        .rt-shell {
          grid-template-rows: auto 1fr;
        }
        .rt-topbar {
          padding: 10px 16px;
          min-height: 56px;
          height: auto;
        }
        .rt-status-strip {
          margin-left: 0;
          width: 100%;
          padding-top: 6px;
          border-top: 1px solid var(--rt-slate-line);
        }
      }
      @media (max-width: 760px) {
        .rt-shell {
          grid-template-columns: 1fr;
          grid-template-areas:
            "topbar"
            "side"
            "main";
          grid-template-rows: auto auto 1fr;
          height: auto;
          min-height: 100vh;
        }
        .rt-side {
          border-right: 0;
          border-bottom: 1px solid var(--rt-slate-line);
        }
        .rt-workspace-pick { width: 100%; }
        .rt-workspace-pick .rt-select { flex: 1; }
        .rt-status-strip { gap: 10px; font-size: 10px; }
      }

      /* ==== Top bar ==== */

      .rt-topbar {
        grid-area: topbar;
        background: var(--rt-deep-ocean);
        border-bottom: 1px solid var(--rt-slate-line);
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .rt-brand {
        font-family: var(--rt-font-mono);
        font-size: 12px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
        white-space: nowrap;
      }
      .rt-brand strong { color: var(--rt-off-white); }

      .rt-workspace-pick {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .rt-workspace-pick label {
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
      }
      .rt-select {
        appearance: none;
        -webkit-appearance: none;
        background: var(--rt-slate-panel);
        color: var(--rt-off-white);
        border: 1px solid var(--rt-slate-line);
        border-radius: 8px;
        padding: 6px 28px 6px 10px;
        font: inherit;
        font-size: 13px;
        background-image: linear-gradient(45deg, transparent 50%, var(--rt-fog) 50%),
          linear-gradient(135deg, var(--rt-fog) 50%, transparent 50%);
        background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        cursor: pointer;
      }
      .rt-select:hover { background-color: var(--rt-slate-2); }
      .rt-select:focus {
        outline: 0;
        box-shadow: var(--rt-focus-ring);
      }

      .rt-status-strip {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
        flex-wrap: wrap;
      }
      .rt-status-strip > .rt-stat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .rt-status-strip strong {
        color: var(--rt-off-white);
        font-weight: 500;
      }
      .rt-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rt-fog-dim);
      }
      .rt-dot--ok {
        background: var(--rt-teal);
        box-shadow: 0 0 12px -2px rgba(34, 240, 230, 0.65);
      }
      .rt-dot--warn { background: var(--rt-warn); }
      .rt-dot--fail { background: var(--rt-fail); }

      /* ==== Sidebar ==== */

      .rt-side {
        grid-area: side;
        background: var(--rt-deep-ocean);
        border-right: 1px solid var(--rt-slate-line);
        padding: 20px 12px;
        overflow-y: auto;
      }
      .rt-side .rt-label {
        display: block;
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
        margin: 14px 8px 6px;
      }
      .rt-side .rt-label:first-child { margin-top: 0; }
      .rt-nav {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .rt-nav li {
        padding: 7px 12px;
        border-radius: 8px;
        color: var(--rt-fog);
        cursor: pointer;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        line-height: 1.2;
      }
      .rt-nav li:hover {
        background: var(--rt-slate-panel);
        color: var(--rt-off-white);
      }
      .rt-nav li.is-active {
        background: var(--rt-slate-panel);
        color: var(--rt-off-white);
        box-shadow: inset 2px 0 0 var(--rt-teal);
      }
      .rt-nav li[data-disabled="true"] {
        color: var(--rt-fog-faint);
        cursor: default;
      }
      .rt-nav li[data-disabled="true"]:hover {
        background: transparent;
        color: var(--rt-fog-faint);
      }
      .rt-nav li .rt-nav-count {
        font-family: var(--rt-font-mono);
        font-size: 11px;
        color: var(--rt-fog-dim);
      }

      /* ==== Main ==== */

      .rt-main {
        grid-area: main;
        padding: 24px 32px 64px;
        min-width: 0;
        overflow: auto;
      }
      @media (max-width: 760px) {
        .rt-main { padding: 16px 16px 48px; }
      }

      .rt-page-head {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .rt-page-head h1 {
        font-size: 22px;
        line-height: 1.18;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        color: var(--rt-off-white);
      }
      .rt-page-head .rt-meta {
        font-family: var(--rt-font-mono);
        font-size: 12px;
        color: var(--rt-fog-dim);
        margin-left: auto;
      }
      .rt-page-sub {
        margin: -4px 0 16px;
        color: var(--rt-fog);
        font-size: 13px;
        max-width: 72ch;
      }

      h2.rt-section {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
        margin: 24px 0 10px;
      }

      .rt-card {
        background: var(--rt-slate-panel);
        border: 1px solid var(--rt-slate-line);
        border-radius: 12px;
        padding: 16px 18px;
      }
      .rt-card + .rt-card { margin-top: 10px; }
      .rt-card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 10px;
      }

      .rt-card-label {
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-teal);
        margin-bottom: 8px;
      }
      .rt-card .rt-mono { font-family: var(--rt-font-mono); }

      .rt-key-rows {
        display: grid;
        grid-template-columns: 140px 1fr;
        column-gap: 12px;
        row-gap: 4px;
        margin-top: 10px;
        font-size: 13px;
      }
      .rt-key-rows .rt-k {
        color: var(--rt-fog-dim);
        font-family: var(--rt-font-mono);
        font-size: 12px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
      }
      .rt-key-rows .rt-v {
        color: var(--rt-off-white);
        word-break: break-word;
      }
      .rt-key-rows .rt-v.rt-mono {
        font-family: var(--rt-font-mono);
        font-size: 12px;
        color: var(--rt-fog);
      }

      /* ==== Pills ==== */

      .rt-pill {
        display: inline-flex;
        align-items: center;
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--rt-slate-strong);
        color: var(--rt-fog);
        white-space: nowrap;
      }
      .rt-pill--pass { color: var(--rt-pass); border-color: rgba(34, 197, 94, 0.4); background: rgba(34, 197, 94, 0.06); }
      .rt-pill--fail { color: var(--rt-fail); border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.07); }
      .rt-pill--warn { color: var(--rt-warn); border-color: rgba(245, 176, 65, 0.45); background: rgba(245, 176, 65, 0.06); }
      .rt-pill--info { color: var(--rt-info); border-color: rgba(34, 240, 230, 0.45); background: rgba(34, 240, 230, 0.05); }
      .rt-pill--mute { color: var(--rt-fog-dim); border-color: var(--rt-slate-line); }

      /* ==== Tables ==== */

      .rt-table-wrap {
        border: 1px solid var(--rt-slate-line);
        border-radius: 10px;
        overflow-x: auto;
        overflow-y: hidden;
        background: var(--rt-slate-panel);
      }
      .rt-table {
        width: 100%;
        min-width: 920px;
        border-collapse: collapse;
        font-size: 13px;
      }
      .rt-table th, .rt-table td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--rt-slate-line);
        vertical-align: middle;
      }
      .rt-table tbody tr:last-child td { border-bottom: 0; }
      .rt-table th {
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
        font-weight: 500;
        background: var(--rt-deep-ocean);
        position: sticky;
        top: 0;
      }
      .rt-table td.rt-mono {
        font-family: var(--rt-font-mono);
        color: var(--rt-fog);
        font-size: 12px;
      }
      .rt-table tbody tr {
        transition: background 100ms ease-in-out;
      }
      .rt-table tbody tr.is-clickable { cursor: pointer; }
      .rt-table tbody tr.is-clickable:hover { background: var(--rt-slate-2); }

      /* ==== Buttons ==== */

      .rt-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        color: var(--rt-fog);
        border: 1px solid var(--rt-slate-line);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 12px;
        font-family: var(--rt-font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .rt-btn:hover {
        background: var(--rt-slate-panel);
        color: var(--rt-off-white);
        border-color: var(--rt-slate-strong);
      }
      .rt-btn:focus { outline: 0; box-shadow: var(--rt-focus-ring); }
      .rt-btn--primary {
        background: var(--rt-teal-ink);
        color: var(--rt-signal-cyan);
        border-color: var(--rt-teal);
      }
      .rt-btn--primary:hover {
        background: var(--rt-teal-deep);
        color: var(--rt-off-white);
        border-color: var(--rt-signal-cyan);
      }

      /* ==== Filter bar ==== */

      .rt-filterbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0 0 14px;
        padding: 10px 12px;
        background: var(--rt-deep-ocean);
        border: 1px solid var(--rt-slate-line);
        border-radius: 10px;
      }
      .rt-filterbar label {
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
      }
      .rt-filterbar .rt-input {
        background: var(--rt-slate-panel);
        color: var(--rt-off-white);
        border: 1px solid var(--rt-slate-line);
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        padding: 5px 8px;
        min-width: 140px;
      }
      .rt-filterbar .rt-input:focus { outline: 0; box-shadow: var(--rt-focus-ring); }
      .rt-filterbar .rt-spacer { flex: 1; }
      .rt-filterbar .rt-meta {
        font-family: var(--rt-font-mono);
        font-size: 11px;
        color: var(--rt-fog-dim);
      }

      /* ==== Empty / loading states ==== */

      .rt-empty {
        color: var(--rt-fog-dim);
        font-size: 13px;
        font-family: var(--rt-font-mono);
        padding: 14px 16px;
        background: var(--rt-deep-ocean);
        border: 1px dashed var(--rt-slate-line);
        border-radius: 10px;
      }
      .rt-empty strong { color: var(--rt-off-white); font-weight: 500; }
      .rt-empty .rt-action {
        margin-top: 6px;
        font-family: var(--rt-font-sans);
        color: var(--rt-fog);
        font-size: 13px;
      }
      .rt-error {
        color: var(--rt-fail);
        background: rgba(239, 68, 68, 0.06);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
      }

      .rt-page { display: none; }
      .rt-page.is-active { display: block; }

      /* ==== Drawer ==== */

      .rt-drawer-scrim {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(7, 11, 17, 0.75);
        z-index: 40;
      }
      .rt-drawer-scrim.is-open { display: block; }
      .rt-drawer {
        display: none;
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 720px;
        max-width: 100%;
        background: var(--rt-slate-panel);
        border-left: 1px solid var(--rt-slate-line);
        z-index: 50;
        flex-direction: column;
      }
      .rt-drawer.is-open { display: flex; }
      .rt-drawer-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--rt-slate-line);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--rt-deep-ocean);
      }
      .rt-drawer-head .rt-card-label { margin: 0; }
      .rt-drawer-head h2 {
        font-size: 16px;
        margin: 0;
        font-weight: 600;
        color: var(--rt-off-white);
      }
      .rt-drawer-head .rt-spacer { flex: 1; }
      .rt-drawer-body {
        padding: 18px 22px;
        overflow: auto;
        flex: 1;
      }
      .rt-drawer-body pre,
      .rt-drawer-body code {
        font-family: var(--rt-font-mono);
        font-size: 12px;
      }
      .rt-drawer-body pre {
        background: var(--rt-deep-ocean);
        border: 1px solid var(--rt-slate-line);
        border-radius: 8px;
        padding: 10px 12px;
        overflow: auto;
        color: var(--rt-off-white);
        white-space: pre;
      }
      .rt-drawer-body .rt-md p { margin: 6px 0 12px; color: var(--rt-fog); }
      .rt-drawer-body .rt-md h1,
      .rt-drawer-body .rt-md h2,
      .rt-drawer-body .rt-md h3 {
        color: var(--rt-off-white);
        margin: 16px 0 6px;
      }
      .rt-drawer-body .rt-md h1 { font-size: 18px; }
      .rt-drawer-body .rt-md h2 { font-size: 15px; }
      .rt-drawer-body .rt-md h3 { font-size: 13px; }
      .rt-drawer-body .rt-md ul,
      .rt-drawer-body .rt-md ol { padding-left: 22px; color: var(--rt-fog); }
      .rt-drawer-body .rt-md li { margin: 2px 0; }
      .rt-drawer-body .rt-md table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 14px;
        font-size: 12px;
        font-family: var(--rt-font-mono);
      }
      .rt-drawer-body .rt-md th,
      .rt-drawer-body .rt-md td {
        text-align: left;
        padding: 5px 9px;
        border-bottom: 1px solid var(--rt-slate-line);
      }
      .rt-drawer-body .rt-md th {
        background: var(--rt-deep-ocean);
        color: var(--rt-fog-dim);
        font-weight: 500;
      }
      .rt-drawer-body .rt-md code {
        background: var(--rt-deep-ocean);
        padding: 1px 5px;
        border-radius: 4px;
        color: var(--rt-off-white);
      }
      .rt-drawer-body .rt-md pre code {
        background: transparent;
        padding: 0;
      }

      /* ==== Diagram view ==== */

      .rt-diagram-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0 0 12px;
        padding: 10px 12px;
        background: var(--rt-deep-ocean);
        border: 1px solid var(--rt-slate-line);
        border-radius: 10px;
      }
      .rt-diagram-toolbar label {
        font-family: var(--rt-font-mono);
        font-size: 11px;
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
        color: var(--rt-fog-dim);
      }
      .rt-diagram-toolbar .rt-input {
        background: var(--rt-slate-panel);
        color: var(--rt-off-white);
        border: 1px solid var(--rt-slate-line);
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        padding: 5px 8px;
        min-width: 140px;
      }
      .rt-diagram-toolbar .rt-input:focus { outline: 0; box-shadow: var(--rt-focus-ring); }
      .rt-diagram-canvas {
        background: var(--rt-deep-ocean);
        border: 1px solid var(--rt-slate-line);
        border-radius: 12px;
        padding: 18px;
        overflow: auto;
        min-height: 460px;
      }
      .rt-diagram-canvas svg {
        display: block;
        max-width: none;
      }
      .rt-diagram-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;
        font-family: var(--rt-font-mono);
        font-size: 11px;
        color: var(--rt-fog-dim);
        letter-spacing: var(--rt-track-label);
        text-transform: uppercase;
      }
      .rt-diagram-legend .rt-lg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .rt-diagram-legend .rt-sw {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--rt-slate-strong);
      }

      /* ==== Iframe drilldown ==== */

      .rt-iframe-frame {
        background: var(--rt-deep-ocean);
        border: 1px solid var(--rt-slate-line);
        border-radius: 10px;
        overflow: hidden;
        height: calc(100vh - 200px);
        min-height: 480px;
      }
      .rt-iframe-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--rt-ink);
      }

      /* ==== Visually hidden ==== */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="rt-shell">
      <header class="rt-topbar">
        <div class="rt-brand"><strong>RIPTIDE</strong> · STUDIO</div>
        <div class="rt-workspace-pick">
          <label for="rt-workspace-select">Workspace</label>
          <select id="rt-workspace-select" class="rt-select" aria-label="Workspace selector"></select>
        </div>
        <div class="rt-status-strip" id="rt-status-strip">
          <span class="rt-stat"><span class="rt-dot" id="rt-health-dot"></span><span id="rt-health-state">Connecting</span></span>
          <span class="rt-stat" id="rt-stat-workspaces"><strong>0</strong>&nbsp;workspaces</span>
          <span class="rt-stat" id="rt-stat-artifacts"><strong>0</strong>&nbsp;artifacts</span>
          <span class="rt-stat" id="rt-stat-verdict"><strong>—</strong>&nbsp;latest verdict</span>
        </div>
      </header>

      <aside class="rt-side">
        <span class="rt-label">Library</span>
        <ul class="rt-nav" id="rt-nav-library"></ul>
        <span class="rt-label">Visual</span>
        <ul class="rt-nav" id="rt-nav-visual"></ul>
        <span class="rt-label">Control plane</span>
        <ul class="rt-nav" id="rt-nav-control"></ul>
      </aside>

      <main class="rt-main" id="rt-main">
        <!-- Pages get rendered here, only one is active at a time. -->
      </main>
    </div>

    <div class="rt-drawer-scrim" id="rt-drawer-scrim"></div>
    <aside class="rt-drawer" id="rt-drawer" aria-hidden="true">
      <div class="rt-drawer-head">
        <div>
          <div class="rt-card-label" id="rt-drawer-kind">Artifact</div>
          <h2 id="rt-drawer-title">—</h2>
        </div>
        <div class="rt-spacer"></div>
        <button class="rt-btn" id="rt-drawer-close" type="button">Close</button>
      </div>
      <div class="rt-drawer-body" id="rt-drawer-body">
        <div class="rt-empty">Loading.</div>
      </div>
    </aside>

    <script>
      "use strict";

      // ============================================================
      // Studio shell — single-file vanilla JS app. No build step.
      // ============================================================

      const NAV = {
        library: [
          { id: "overview", label: "Overview", section: "library" },
          { id: "runs", label: "Runs", section: "library", filter: { kinds: ["run", "last-run", "run-collection"] } },
          { id: "campaigns", label: "Campaigns", section: "library", filter: { kinds: ["campaign-root", "campaign-input", "retained-case"] } },
          { id: "packs", label: "Replay packs", section: "library", filter: { kinds: ["pack"] } },
          { id: "guided", label: "Guided sims", section: "library", filter: { kinds: ["guided-sim"] } },
          { id: "readiness", label: "Readiness reports", section: "library", filter: { kinds: ["readiness-report"] } },
          { id: "scenarios", label: "Scenarios + adapters", section: "library", filter: { kinds: ["scenario", "adapter", "markdown-summary"] } }
        ],
        visual: [
          { id: "diagram", label: "Diagram", section: "visual" },
          { id: "dashboard", label: "Run dashboard", section: "visual" }
        ],
        control: [
          { id: "launch", label: "Launch", section: "control", disabled: true, hint: "T08" },
          { id: "config", label: "Config handoff", section: "control", disabled: true, hint: "T09" }
        ]
      };

      const STATE = {
        workspaces: [],
        activeWorkspaceId: null,
        artifacts: [],
        artifactWarnings: [],
        artifactsLoading: false,
        artifactsError: null,
        health: null,
        activePageId: "overview",
        filters: { type: "all", verdict: "all", status: "all", protocol: "all", text: "" },
        graphSelection: { adapter: "", scenario: "", campaign: "", run: "", pack: "" },
        graph: null,
        graphLoading: false,
        graphError: null,
        dashboardSource: null,
        labels: {}
      };

      const KIND_LABELS = {
        "run-collection": "Run collection",
        "last-run": "Last run",
        "run": "Run",
        "campaign-root": "Campaign",
        "retained-case": "Retained case",
        "campaign-input": "Campaign config",
        "pack": "Replay pack",
        "guided-sim": "Guided sim",
        "readiness-report": "Readiness report",
        "markdown-summary": "Summary",
        "scenario": "Scenario",
        "adapter": "Adapter"
      };

      const NODE_KIND_COLORS = {
        workspace: "#22F0E6",
        engine: "#14B8B6",
        adapter: "#7A8A99",
        semantics: "#22F0E6",
        persona: "#14B8B6",
        scenario: "#AEBDCB",
        campaign: "#F5B041",
        parameter: "#F5B041",
        invariant: "#EF4444",
        run: "#22C55E",
        report: "#AEBDCB",
        pack: "#7A8A99"
      };

      // -------------------------------------------------------
      // Boot.
      // -------------------------------------------------------

      async function boot() {
        renderSidebar();
        bindGlobalUi();
        try {
          const health = await fetchJson("/api/studio/health");
          STATE.health = health;
          setHealthOk(health);
        } catch (err) {
          setHealthError(err);
          renderActivePage();
          return;
        }

        try {
          const wsResponse = await fetchJson("/api/studio/workspaces");
          STATE.workspaces = Array.isArray(wsResponse.workspaces) ? wsResponse.workspaces : [];
          // Allow deep-linking via `?workspace=<id>&page=<id>` so docs and
          // demo paths can land on a specific workspace + page directly.
          const urlParams = new URLSearchParams(window.location.search);
          const requestedWorkspace = urlParams.get("workspace");
          const requestedPage = urlParams.get("page");
          const matchedWorkspace = requestedWorkspace
            ? STATE.workspaces.find((w) => w.id === requestedWorkspace)
            : null;
          STATE.activeWorkspaceId = matchedWorkspace
            ? matchedWorkspace.id
            : STATE.workspaces[0]
              ? STATE.workspaces[0].id
              : null;
          if (requestedPage) {
            const allItems = [...NAV.library, ...NAV.visual, ...NAV.control];
            if (allItems.some((it) => it.id === requestedPage && !it.disabled)) {
              STATE.activePageId = requestedPage;
              highlightActiveNav();
            }
          }
          renderWorkspaceSelect();
          updateStatusStrip();
          await loadArtifactsForActiveWorkspace();
          updateStatusStrip();
          renderActivePage();
        } catch (err) {
          renderActivePage();
          showFatal("Could not load workspaces: " + (err && err.message ? err.message : String(err)));
        }
      }

      function bindGlobalUi() {
        document.getElementById("rt-workspace-select").addEventListener("change", (event) => {
          STATE.activeWorkspaceId = event.target.value;
          STATE.graph = null;
          STATE.graphSelection = { adapter: "", scenario: "", campaign: "", run: "", pack: "" };
          loadArtifactsForActiveWorkspace().then(() => {
            updateStatusStrip();
            renderActivePage();
          });
        });
        document.getElementById("rt-drawer-close").addEventListener("click", closeDrawer);
        document.getElementById("rt-drawer-scrim").addEventListener("click", closeDrawer);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeDrawer();
        });
      }

      // -------------------------------------------------------
      // Sidebar / nav.
      // -------------------------------------------------------

      function renderSidebar() {
        renderNavList("rt-nav-library", NAV.library);
        renderNavList("rt-nav-visual", NAV.visual);
        renderNavList("rt-nav-control", NAV.control);
        highlightActiveNav();
      }

      function renderNavList(rootId, items) {
        const root = document.getElementById(rootId);
        root.innerHTML = "";
        for (const item of items) {
          const li = document.createElement("li");
          li.dataset.pageId = item.id;
          if (item.disabled) li.dataset.disabled = "true";
          const left = document.createElement("span");
          left.textContent = item.label;
          li.appendChild(left);
          if (item.disabled && item.hint) {
            const hint = document.createElement("span");
            hint.className = "rt-nav-count";
            hint.textContent = "soon · " + item.hint;
            li.appendChild(hint);
          } else {
            const count = document.createElement("span");
            count.className = "rt-nav-count";
            count.dataset.countFor = item.id;
            li.appendChild(count);
          }
          if (!item.disabled) {
            li.addEventListener("click", () => {
              STATE.activePageId = item.id;
              highlightActiveNav();
              renderActivePage();
            });
          }
          root.appendChild(li);
        }
      }

      function highlightActiveNav() {
        for (const li of document.querySelectorAll(".rt-nav li[data-page-id]")) {
          li.classList.toggle("is-active", li.dataset.pageId === STATE.activePageId);
        }
      }

      function updateNavCounts() {
        const allCounts = {};
        for (const item of [...NAV.library, ...NAV.visual]) {
          if (item.disabled) continue;
          if (item.id === "overview") {
            allCounts.overview = STATE.artifacts.length;
            continue;
          }
          if (item.id === "diagram" || item.id === "dashboard") continue;
          const filterKinds = item.filter && item.filter.kinds;
          if (!filterKinds) continue;
          allCounts[item.id] = STATE.artifacts.filter((a) => filterKinds.indexOf(a.kind) >= 0).length;
        }
        for (const node of document.querySelectorAll(".rt-nav-count")) {
          if (!node.dataset.countFor) continue;
          const v = allCounts[node.dataset.countFor];
          node.textContent = typeof v === "number" ? String(v) : "";
        }
      }

      // -------------------------------------------------------
      // Top bar.
      // -------------------------------------------------------

      function setHealthOk(health) {
        document.getElementById("rt-health-dot").className = "rt-dot rt-dot--ok";
        document.getElementById("rt-health-state").textContent = "Local · " + (health.workspace_count || 0) + " ws";
      }
      function setHealthError(err) {
        document.getElementById("rt-health-dot").className = "rt-dot rt-dot--fail";
        document.getElementById("rt-health-state").textContent = "Offline";
        const main = document.getElementById("rt-main");
        main.innerHTML = "";
        const card = document.createElement("div");
        card.className = "rt-error";
        card.textContent = "Studio API unreachable: " + (err && err.message ? err.message : String(err));
        main.appendChild(card);
      }

      function renderWorkspaceSelect() {
        const select = document.getElementById("rt-workspace-select");
        select.innerHTML = "";
        if (!STATE.workspaces.length) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "no workspaces";
          select.appendChild(opt);
          select.disabled = true;
          return;
        }
        select.disabled = false;
        for (const ws of STATE.workspaces) {
          const opt = document.createElement("option");
          opt.value = ws.id;
          const tag = ws.source === "current" ? "current" : "case-study";
          opt.textContent = ws.label + " · " + tag;
          select.appendChild(opt);
        }
        if (STATE.activeWorkspaceId) {
          select.value = STATE.activeWorkspaceId;
        }
      }

      function updateStatusStrip() {
        document.getElementById("rt-stat-workspaces").innerHTML =
          "<strong>" + STATE.workspaces.length + "</strong>&nbsp;workspaces";
        document.getElementById("rt-stat-artifacts").innerHTML =
          "<strong>" + STATE.artifacts.length + "</strong>&nbsp;artifacts";
        const verdict = pickLatestVerdict();
        document.getElementById("rt-stat-verdict").innerHTML =
          "<strong>" + escapeHtml(verdict.label) + "</strong>&nbsp;" + verdict.suffix;
      }

      function pickLatestVerdict() {
        // Find the freshest run/last-run artifact and surface its status.
        const candidates = STATE.artifacts
          .filter((a) => a.kind === "run" || a.kind === "last-run" || a.kind === "run-collection")
          .filter((a) => a.updated_at)
          .sort((a, b) => (a.updated_at < b.updated_at ? 1 : -1));
        if (!candidates.length) return { label: "no runs", suffix: "" };
        const top = candidates[0];
        if (top.status === "fail") return { label: "FAIL", suffix: top.label };
        if (top.status === "pass") return { label: "PASS", suffix: top.label };
        if (top.verdict) return { label: top.verdict, suffix: top.label };
        return { label: top.kind, suffix: top.label };
      }

      // -------------------------------------------------------
      // Workspace data.
      // -------------------------------------------------------

      async function loadArtifactsForActiveWorkspace() {
        if (!STATE.activeWorkspaceId) {
          STATE.artifacts = [];
          return;
        }
        STATE.artifactsLoading = true;
        STATE.artifactsError = null;
        try {
          const data = await fetchJson(
            "/api/studio/artifacts?workspace=" + encodeURIComponent(STATE.activeWorkspaceId)
          );
          STATE.artifacts = Array.isArray(data.artifacts) ? data.artifacts : [];
          STATE.artifactWarnings = Array.isArray(data.warnings) ? data.warnings : [];
        } catch (err) {
          STATE.artifacts = [];
          STATE.artifactWarnings = [];
          STATE.artifactsError = err && err.message ? err.message : String(err);
        } finally {
          STATE.artifactsLoading = false;
          updateNavCounts();
        }
      }

      // -------------------------------------------------------
      // Page router.
      // -------------------------------------------------------

      function renderActivePage() {
        const main = document.getElementById("rt-main");
        main.innerHTML = "";
        const allItems = [...NAV.library, ...NAV.visual, ...NAV.control];
        const item = allItems.find((it) => it.id === STATE.activePageId) || NAV.library[0];
        if (item.id === "overview") return renderOverviewPage(main);
        if (item.id === "diagram") return renderDiagramPage(main);
        if (item.id === "dashboard") return renderDashboardPage(main);
        if (item.id === "launch") return renderComingSoon(main, "Launch", "T08 ships the local job queue. Until then run jobs from the CLI.");
        if (item.id === "config") return renderComingSoon(main, "Config handoff", "T09 ships the chat handoff. The riptide-config skill is the manual path today.");
        return renderLibraryPage(main, item);
      }

      function renderComingSoon(main, title, message) {
        const head = document.createElement("div");
        head.className = "rt-page-head";
        head.innerHTML = "<h1>" + escapeHtml(title) + "</h1>";
        main.appendChild(head);
        const empty = document.createElement("div");
        empty.className = "rt-empty";
        empty.innerHTML = "<strong>Not in this Phase.</strong><div class=\"rt-action\">" + escapeHtml(message) + "</div>";
        main.appendChild(empty);
      }

      // -------------------------------------------------------
      // Overview page.
      // -------------------------------------------------------

      function renderOverviewPage(main) {
        const ws = activeWorkspace();
        const head = document.createElement("div");
        head.className = "rt-page-head";
        const title = document.createElement("h1");
        title.textContent = ws ? ws.label : "Workspace";
        head.appendChild(title);
        const meta = document.createElement("span");
        meta.className = "rt-meta";
        if (STATE.health) {
          meta.textContent = "studio " + STATE.health.schema_version + " · started " + STATE.health.started_at;
        }
        head.appendChild(meta);
        main.appendChild(head);

        const sub = document.createElement("p");
        sub.className = "rt-page-sub";
        sub.textContent =
          "Local control plane. Read-only view of workspaces, artifacts, jobs, and the simulation graph. The CLI remains the source of truth for every run.";
        main.appendChild(sub);

        // Workspace cards.
        const wsHeader = document.createElement("h2");
        wsHeader.className = "rt-section";
        wsHeader.textContent = "Workspaces";
        main.appendChild(wsHeader);

        const grid = document.createElement("div");
        grid.className = "rt-card-grid";
        if (!STATE.workspaces.length) {
          const empty = document.createElement("div");
          empty.className = "rt-empty";
          empty.innerHTML = "<strong>No workspaces.</strong><div class=\"rt-action\">Pass --case-studies-root or open a Riptide workspace as your cwd.</div>";
          main.appendChild(empty);
        } else {
          for (const w of STATE.workspaces) {
            const card = document.createElement("div");
            card.className = "rt-card";
            const label = document.createElement("div");
            label.className = "rt-card-label";
            label.textContent = w.source === "current" ? "Current cwd" : "Case study";
            card.appendChild(label);
            const name = document.createElement("div");
            name.style.cssText = "font-weight:500;color:var(--rt-off-white);";
            name.textContent = w.label;
            card.appendChild(name);
            const path = document.createElement("div");
            path.className = "rt-mono";
            path.style.cssText = "font-size:12px;color:var(--rt-fog-dim);margin-top:4px;word-break:break-all;";
            path.textContent = w.path;
            card.appendChild(path);
            const tags = document.createElement("div");
            tags.style.cssText = "margin-top:10px;display:flex;gap:6px;";
            const ridePill = document.createElement("span");
            ridePill.className = w.has_riptide ? "rt-pill rt-pill--info" : "rt-pill rt-pill--warn";
            ridePill.textContent = w.has_riptide ? ".RIPTIDE" : "NO .RIPTIDE";
            tags.appendChild(ridePill);
            card.appendChild(tags);
            for (const warn of w.warnings || []) {
              const note = document.createElement("div");
              note.className = "rt-empty";
              note.style.cssText = "margin-top:10px;background:transparent;";
              note.innerHTML = "<strong>" + escapeHtml(warn.message) + ".</strong><div class=\"rt-action\">" + escapeHtml(warn.next_action) + "</div>";
              card.appendChild(note);
            }
            grid.appendChild(card);
          }
          main.appendChild(grid);
        }

        // Artifact summary table.
        const artHeader = document.createElement("h2");
        artHeader.className = "rt-section";
        artHeader.textContent = "Recent artifacts · " + (ws ? ws.label : "");
        main.appendChild(artHeader);
        renderArtifactTable(main, recentArtifactsForOverview(), {
          emptyTitle: "No artifacts indexed yet.",
          emptyAction: "Run riptide run, riptide campaign run, or riptide review against this workspace."
        });
        renderArtifactWarnings(main);
      }

      function recentArtifactsForOverview() {
        const fresh = STATE.artifacts.slice().sort((a, b) => (a.updated_at || "") < (b.updated_at || "") ? 1 : -1);
        return fresh.slice(0, 8);
      }

      // -------------------------------------------------------
      // Library page (filtered table view).
      // -------------------------------------------------------

      function renderLibraryPage(main, item) {
        const ws = activeWorkspace();
        const head = document.createElement("div");
        head.className = "rt-page-head";
        const title = document.createElement("h1");
        title.textContent = item.label;
        head.appendChild(title);
        const meta = document.createElement("span");
        meta.className = "rt-meta";
        meta.textContent = ws ? ws.label : "";
        head.appendChild(meta);
        main.appendChild(head);

        const sub = document.createElement("p");
        sub.className = "rt-page-sub";
        sub.textContent = pageDescription(item.id);
        main.appendChild(sub);

        const filterKinds = (item.filter && item.filter.kinds) || null;
        const filtered = filteredArtifactsFor(filterKinds);

        renderFilterBar(main, filterKinds, filtered.length, STATE.artifacts.length);
        const visible = applyUserFilters(filtered);

        renderArtifactTable(main, visible, {
          emptyTitle: "No matching artifacts.",
          emptyAction: filterKinds
            ? "Loosen filters above or generate fresh artifacts via the CLI."
            : "Run riptide run/campaign/review/readiness against this workspace."
        });
        renderArtifactWarnings(main);
      }

      function pageDescription(id) {
        switch (id) {
          case "runs":
            return "Per-scenario runs and the summary collection. Open a row to read the report or jump into the dashboard drilldown.";
          case "campaigns":
            return "Campaign roots, configs, and retained cases. Verdict and canonical hash come straight from campaign-summary.json.";
          case "packs":
            return "Replay packs frozen for byte-identical re-execution. Canonical hash is the artifact's identity.";
          case "guided":
            return "Guided sim crates and per-run guided-sim-run.json artifacts.";
          case "readiness":
            return "Readiness reports — the corpus rollup + per-workspace readiness rows.";
          case "scenarios":
            return "Scenario folders, adapter TOML, and Markdown summaries shipped under .riptide/.";
          default:
            return "";
        }
      }

      function filteredArtifactsFor(kinds) {
        if (!kinds || !kinds.length) return STATE.artifacts.slice();
        return STATE.artifacts.filter((a) => kinds.indexOf(a.kind) >= 0);
      }

      function applyUserFilters(rows) {
        const f = STATE.filters;
        return rows.filter((row) => {
          if (f.type !== "all" && row.kind !== f.type) return false;
          if (f.verdict !== "all") {
            if (f.verdict === "PASS" && row.status !== "pass" && row.verdict !== "no-failure-observed") return false;
            if (f.verdict === "FAIL" && row.status !== "fail" && row.verdict !== "failure-observed") return false;
            if (f.verdict === "WARN" && (!row.warnings || row.warnings.length === 0)) return false;
          }
          if (f.status !== "all" && rowStatus(row) !== f.status) return false;
          if (f.protocol !== "all" && protocolClassFor(row) !== f.protocol) return false;
          if (f.text) {
            const text = (row.label + " " + row.relative_path + " " + protocolClassFor(row)).toLowerCase();
            if (text.indexOf(f.text.toLowerCase()) < 0) return false;
          }
          return true;
        });
      }

      function renderFilterBar(main, allowedKinds, visibleCount, totalCount) {
        const bar = document.createElement("div");
        bar.className = "rt-filterbar";
        const baseRows = filteredArtifactsFor(allowedKinds);

        const typeLabel = document.createElement("label");
        typeLabel.htmlFor = "rt-flt-type";
        typeLabel.textContent = "Type";
        bar.appendChild(typeLabel);
        const typeSelect = document.createElement("select");
        typeSelect.id = "rt-flt-type";
        typeSelect.className = "rt-input";
        typeSelect.innerHTML =
          '<option value="all">All</option>' +
          (allowedKinds || Object.keys(KIND_LABELS))
            .map((k) => '<option value="' + escapeAttr(k) + '">' + escapeHtml(KIND_LABELS[k] || k) + "</option>")
            .join("");
        typeSelect.value = STATE.filters.type;
        typeSelect.addEventListener("change", (e) => {
          STATE.filters.type = e.target.value;
          renderActivePage();
        });
        bar.appendChild(typeSelect);

        const verdictLabel = document.createElement("label");
        verdictLabel.htmlFor = "rt-flt-verdict";
        verdictLabel.textContent = "Verdict";
        bar.appendChild(verdictLabel);
        const verdictSelect = document.createElement("select");
        verdictSelect.id = "rt-flt-verdict";
        verdictSelect.className = "rt-input";
        verdictSelect.innerHTML =
          '<option value="all">All</option>' +
          '<option value="PASS">PASS / no failure observed</option>' +
          '<option value="FAIL">FAIL / failure observed</option>' +
          '<option value="WARN">Warnings present</option>';
        verdictSelect.value = STATE.filters.verdict;
        verdictSelect.addEventListener("change", (e) => {
          STATE.filters.verdict = e.target.value;
          renderActivePage();
        });
        bar.appendChild(verdictSelect);

        const statusOptions = uniqueDefined(baseRows.map(rowStatus));
        if (statusOptions.length) {
          const statusLabel = document.createElement("label");
          statusLabel.htmlFor = "rt-flt-status";
          statusLabel.textContent = "Status";
          bar.appendChild(statusLabel);
          const statusSelect = document.createElement("select");
          statusSelect.id = "rt-flt-status";
          statusSelect.className = "rt-input";
          statusSelect.innerHTML =
            '<option value="all">All</option>' +
            statusOptions
              .map((s) => '<option value="' + escapeAttr(s) + '">' + escapeHtml(s.toUpperCase()) + "</option>")
              .join("");
          if (STATE.filters.status !== "all" && statusOptions.indexOf(STATE.filters.status) < 0) {
            STATE.filters.status = "all";
          }
          statusSelect.value = STATE.filters.status;
          statusSelect.addEventListener("change", (e) => {
            STATE.filters.status = e.target.value;
            renderActivePage();
          });
          bar.appendChild(statusSelect);
        }

        const protocolOptions = uniqueDefined(baseRows.map(protocolClassFor));
        if (protocolOptions.length) {
          const protocolLabel = document.createElement("label");
          protocolLabel.htmlFor = "rt-flt-protocol";
          protocolLabel.textContent = "Protocol class";
          bar.appendChild(protocolLabel);
          const protocolSelect = document.createElement("select");
          protocolSelect.id = "rt-flt-protocol";
          protocolSelect.className = "rt-input";
          protocolSelect.innerHTML =
            '<option value="all">All</option>' +
            protocolOptions
              .map((s) => '<option value="' + escapeAttr(s) + '">' + escapeHtml(s) + "</option>")
              .join("");
          if (STATE.filters.protocol !== "all" && protocolOptions.indexOf(STATE.filters.protocol) < 0) {
            STATE.filters.protocol = "all";
          }
          protocolSelect.value = STATE.filters.protocol;
          protocolSelect.addEventListener("change", (e) => {
            STATE.filters.protocol = e.target.value;
            renderActivePage();
          });
          bar.appendChild(protocolSelect);
        }

        const search = document.createElement("input");
        search.type = "search";
        search.placeholder = "filter by name or path";
        search.className = "rt-input";
        search.value = STATE.filters.text;
        search.addEventListener("input", (e) => {
          STATE.filters.text = e.target.value;
          renderActivePage();
        });
        bar.appendChild(search);

      function statusPill(row) {
        if (row.status === "pass") return '<span class="rt-pill rt-pill--pass">PASS</span>';
        if (row.status === "fail") return '<span class="rt-pill rt-pill--fail">FAIL</span>';
        if (row.status === "blocked") return '<span class="rt-pill rt-pill--warn">BLOCKED</span>';
        if (row.status === "warn") return '<span class="rt-pill rt-pill--warn">WARN</span>';
        if (row.verdict === "failure-observed") return '<span class="rt-pill rt-pill--fail">FAIL</span>';
        if (row.verdict === "no-failure-observed") return '<span class="rt-pill rt-pill--pass">NO FAIL</span>';
        if (row.verdict) return '<span class="rt-pill rt-pill--info">' + escapeHtml(String(row.verdict).toUpperCase()) + '</span>';
        if (row.warnings && row.warnings.length) return '<span class="rt-pill rt-pill--warn">WARN</span>';
        return '<span class="rt-pill rt-pill--mute">INFO</span>';
      }

      function rowDetail(row) {
        const parts = [];
        if (typeof row.invariant_fire_count === "number") parts.push(row.invariant_fire_count + " inv");
        if (row.canonical_hash) parts.push("hash " + row.canonical_hash.slice(0, 10));
        if (row.coverage) parts.push("cov " + row.coverage);
        if (row.confidence) parts.push("conf " + row.confidence);
        if (protocolClassFor(row)) parts.push("class " + protocolClassFor(row));
        if (row.meta && typeof row.meta.total_scenarios === "number") parts.push(row.meta.total_scenarios + " sc");
        if (row.meta && typeof row.meta.total_runs === "number") parts.push(row.meta.total_runs + " runs");
        if (row.meta && typeof row.meta.retained_runs === "number") parts.push(row.meta.retained_runs + " retained");
        if (row.meta && typeof row.meta.total_ticks === "number") parts.push(row.meta.total_ticks + " ticks");
        if (row.meta && typeof row.meta.scenario === "string") parts.push(row.meta.scenario);
        return parts.length ? parts.join(" · ") : "—";
      }

      async function loadAndRenderDiagram() {
        const canvas = document.getElementById("rt-diagram-canvas");
        if (!canvas) return;
        canvas.innerHTML = "<div class=\"rt-empty\">Loading graph.</div>";
        const params = new URLSearchParams();
        params.set("workspace", STATE.activeWorkspaceId || "");
        for (const key of ["adapter", "scenario", "campaign", "run", "pack"]) {
          if (STATE.graphSelection[key]) params.set(key, STATE.graphSelection[key]);
        }
        try {
          const data = await fetchJson("/api/studio/graph?" + params.toString());
          STATE.graph = data;
          renderDiagramSvg(canvas, data);
          renderGraphWarnings(canvas, data.warnings || []);
        } catch (err) {
          canvas.innerHTML = "";
          const e = document.createElement("div");
          e.className = "rt-error";
          e.textContent = "Could not build graph: " + (err && err.message ? err.message : String(err));
          canvas.appendChild(e);
        }
      }

      function renderGraphWarnings(canvas, warnings) {
        if (!warnings || !warnings.length) return;
        const wrap = document.createElement("div");
        wrap.style.cssText = "margin-top:14px;display:flex;flex-direction:column;gap:6px;";
        for (const w of warnings) {
          const card = document.createElement("div");
          card.className = "rt-empty";
          card.innerHTML = "<strong>" + escapeHtml(w.message) + ".</strong><div class=\"rt-action\">" + escapeHtml(w.next_action) + "</div>";
          wrap.appendChild(card);
        }
        canvas.appendChild(wrap);
      }

      function renderDiagramSvg(canvas, graph) {
        canvas.innerHTML = "";
        if (!graph.nodes || !graph.nodes.length) {
          const empty = document.createElement("div");
          empty.className = "rt-empty";
          empty.innerHTML = "<strong>No graph data.</strong><div class=\"rt-action\">Pick a workspace with adapters and scenarios in .riptide/.</div>";
          canvas.appendChild(empty);
          return;
        }

        // Deterministic columnar layout. Columns are kind-bands.
        const COLS = ["workspace", "adapter", "semantics", "persona", "scenario", "campaign", "parameter", "engine", "invariant", "run", "report", "pack"];
        const columns = {};
        for (const k of COLS) columns[k] = [];
        for (const node of graph.nodes) {
          const bucket = columns[node.kind] || (columns[node.kind] = []);
          bucket.push(node);
        }
        const layoutCols = [];
        for (const k of COLS) {
          if ((columns[k] || []).length) layoutCols.push({ kind: k, nodes: columns[k] });
        }
        for (const k of Object.keys(columns)) {
          if (COLS.indexOf(k) < 0 && columns[k].length) layoutCols.push({ kind: k, nodes: columns[k] });
        }

        const NODE_W = 168;
        const NODE_H = 56;
        const COL_GAP = 56;
        const ROW_GAP = 22;
        const PAD_X = 28;
        const PAD_Y = 28;

        // Compute positions.
        const positions = new Map();
        let maxRows = 0;
        for (const col of layoutCols) {
          maxRows = Math.max(maxRows, col.nodes.length);
        }
        layoutCols.forEach((col, colIdx) => {
          const x = PAD_X + colIdx * (NODE_W + COL_GAP);
          col.nodes.forEach((node, rowIdx) => {
            const colHeight = col.nodes.length;
            const offset = (maxRows - colHeight) * (NODE_H + ROW_GAP) / 2;
            const y = PAD_Y + offset + rowIdx * (NODE_H + ROW_GAP);
            positions.set(node.id, { x, y, w: NODE_W, h: NODE_H, kind: node.kind });
          });
        });

        const totalW = PAD_X * 2 + layoutCols.length * NODE_W + (layoutCols.length - 1) * COL_GAP;
        const totalH = PAD_Y * 2 + maxRows * NODE_H + (maxRows - 1) * ROW_GAP;

        const svgNs = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNs, "svg");
        svg.setAttribute("width", String(totalW));
        svg.setAttribute("height", String(totalH));
        svg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);
        svg.style.width = totalW + "px";
        svg.style.height = totalH + "px";

        // Defs: arrow marker.
        const defs = document.createElementNS(svgNs, "defs");
        const marker = document.createElementNS(svgNs, "marker");
        marker.setAttribute("id", "arrow");
        marker.setAttribute("viewBox", "0 0 10 10");
        marker.setAttribute("refX", "8");
        marker.setAttribute("refY", "5");
        marker.setAttribute("markerWidth", "8");
        marker.setAttribute("markerHeight", "8");
        marker.setAttribute("orient", "auto-start-reverse");
        const arrowPath = document.createElementNS(svgNs, "path");
        arrowPath.setAttribute("d", "M0,0 L10,5 L0,10 z");
        arrowPath.setAttribute("fill", "#2A3B4E");
        marker.appendChild(arrowPath);
        defs.appendChild(marker);
        svg.appendChild(defs);

        // Edges first (drawn under nodes).
        for (const edge of graph.edges || []) {
          const a = positions.get(edge.from);
          const b = positions.get(edge.to);
          if (!a || !b) continue;
          const startX = a.x + a.w;
          const startY = a.y + a.h / 2;
          const endX = b.x;
          const endY = b.y + b.h / 2;
          // Cubic curve when going forward, otherwise loop above.
          const goingForward = endX > startX;
          let path;
          if (goingForward) {
            const dx = Math.max(36, (endX - startX) / 2);
            path = "M" + startX + "," + startY +
              " C" + (startX + dx) + "," + startY +
              " " + (endX - dx) + "," + endY +
              " " + endX + "," + endY;
          } else {
            // Go up and over for backward edges (e.g. parameter -> campaign).
            const lift = Math.min(a.y, b.y) - 22;
            path = "M" + startX + "," + startY +
              " C" + (startX + 60) + "," + lift +
              " " + (endX - 60) + "," + lift +
              " " + endX + "," + endY;
          }
          const line = document.createElementNS(svgNs, "path");
          line.setAttribute("d", path);
          line.setAttribute("fill", "none");
          line.setAttribute("stroke", "#2A3B4E");
          line.setAttribute("stroke-width", "1.25");
          line.setAttribute("marker-end", "url(#arrow)");
          svg.appendChild(line);

          // Edge label
          const midX = (startX + endX) / 2;
          const midY = (startY + endY) / 2 - 6;
          const label = document.createElementNS(svgNs, "text");
          label.setAttribute("x", String(midX));
          label.setAttribute("y", String(midY));
          label.setAttribute("font-family", "IBM Plex Mono, monospace");
          label.setAttribute("font-size", "10");
          label.setAttribute("fill", "#7A8A99");
          label.setAttribute("text-anchor", "middle");
          label.textContent = edge.label;
          svg.appendChild(label);
        }

        // Nodes.
        for (const node of graph.nodes) {
          const pos = positions.get(node.id);
          if (!pos) continue;
          const g = document.createElementNS(svgNs, "g");
          g.setAttribute("transform", "translate(" + pos.x + "," + pos.y + ")");
          g.style.cursor = "pointer";

          const rect = document.createElementNS(svgNs, "rect");
          rect.setAttribute("width", String(pos.w));
          rect.setAttribute("height", String(pos.h));
          rect.setAttribute("rx", "8");
          rect.setAttribute("fill", "#121A24");
          rect.setAttribute("stroke", NODE_KIND_COLORS[node.kind] || "#1E2A38");
          rect.setAttribute("stroke-width", "1");
          g.appendChild(rect);

          // Kind kicker
          const kicker = document.createElementNS(svgNs, "text");
          kicker.setAttribute("x", "12");
          kicker.setAttribute("y", "16");
          kicker.setAttribute("font-family", "IBM Plex Mono, monospace");
          kicker.setAttribute("font-size", "9");
          kicker.setAttribute("letter-spacing", "1.3");
          kicker.setAttribute("fill", NODE_KIND_COLORS[node.kind] || "#7A8A99");
          kicker.textContent = node.kind.toUpperCase();
          g.appendChild(kicker);

          // Label (truncate to ~24 chars to fit)
          const label = document.createElementNS(svgNs, "text");
          label.setAttribute("x", "12");
          label.setAttribute("y", "36");
          label.setAttribute("font-family", "Inter, sans-serif");
          label.setAttribute("font-size", "13");
          label.setAttribute("fill", "#E6EEF2");
          label.textContent = truncate(node.label, 24);
          g.appendChild(label);

          // Source path muted line (truncated)
          if (node.source_path) {
            const sub = document.createElementNS(svgNs, "text");
            sub.setAttribute("x", "12");
            sub.setAttribute("y", "50");
            sub.setAttribute("font-family", "IBM Plex Mono, monospace");
            sub.setAttribute("font-size", "9");
            sub.setAttribute("fill", "#7A8A99");
            sub.textContent = truncate(node.source_path.replace(/^.+?\.riptide\//, ".riptide/"), 26);
            g.appendChild(sub);
          }

          g.addEventListener("click", () => openGraphNodeDrawer(node));

          svg.appendChild(g);
        }

        canvas.appendChild(svg);
      }

      function openGraphNodeDrawer(node) {
        const drawer = document.getElementById("rt-drawer");
        document.getElementById("rt-drawer-kind").textContent = (node.kind || "").toUpperCase();
        document.getElementById("rt-drawer-title").textContent = node.label;

          meta.appendChild(pre);
          body.appendChild(meta);
        }
        openDrawer();
      }

      function sourceOptionsFromArtifacts() {
        const out = [];
        const collection = STATE.artifacts.find((a) => a.kind === "run-collection");
        if (collection) {
          out.push({ value: collection.relative_path, label: "run-collection.json (sweep summary)" });
        }
        for (const row of STATE.artifacts) {
          if (row.kind === "run") {
            out.push({ value: row.relative_path, label: "run · " + row.label });
          } else if (row.kind === "retained-case") {
            out.push({ value: row.relative_path, label: "retained · " + row.label });
          } else if (row.kind === "pack") {
            out.push({ value: row.relative_path, label: "pack · " + row.label });
          }
        }
        if (!out.length) {
          out.push({ value: "", label: "no runs available" });
        }
        return out;
      }

      function renderDashboardIframe() {
        const frame = document.getElementById("rt-dashboard-frame");
        if (!frame) return;
        const open = document.getElementById("rt-dashboard-open");
        frame.innerHTML = "";
        const source = STATE.dashboardSource || "";
        if (!source) {
          frame.innerHTML = '<div class="rt-empty" style="margin:18px;"><strong>No runs to drill into.</strong><div class="rt-action">Run riptide run, then refresh.</div></div>';
          if (open) {
            open.removeAttribute("href");
            open.setAttribute("aria-disabled", "true");
            open.classList.add("is-disabled");
          }
          return;
        }
        const wsParam = STATE.activeWorkspaceId
          ? "&workspace=" + encodeURIComponent(STATE.activeWorkspaceId)
          : "";
        const url = "/dashboard?source=" + encodeURIComponent(source) + wsParam;
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.title = "Run dashboard for " + source;
        frame.appendChild(iframe);
        if (open) {
          open.href = url;
          open.removeAttribute("aria-disabled");
        }
      }

      // Drawer (artifact detail / report viewer / graph node).

      async function openArtifactDrawer(row) {
        document.getElementById("rt-drawer-kind").textContent = (KIND_LABELS[row.kind] || row.kind).toUpperCase();
        document.getElementById("rt-drawer-title").textContent = row.label;
        const body = document.getElementById("rt-drawer-body");
        body.innerHTML = "";

        // Metadata block first.
        const metaBlock = document.createElement("div");
        metaBlock.className = "rt-key-rows";
        const keys = [];
        keys.push(["Kind", KIND_LABELS[row.kind] || row.kind]);
        if (row.status) keys.push(["Status", row.status]);
        if (row.verdict) keys.push(["Verdict", row.verdict]);
        if (row.coverage) keys.push(["Coverage", row.coverage]);
        if (row.confidence) keys.push(["Confidence", row.confidence]);
        if (protocolClassFor(row)) keys.push(["Protocol class", protocolClassFor(row)]);
        if (typeof row.invariant_fire_count === "number") keys.push(["Invariant fires", String(row.invariant_fire_count)]);
        if (row.canonical_hash) keys.push(["Canonical hash", row.canonical_hash]);
        if (row.updated_at) keys.push(["Updated", formatDate(row.updated_at)]);
        keys.push(["Path", row.relative_path]);
        for (const [k, v] of keys) {
          const kEl = document.createElement("div");
          kEl.className = "rt-k";
          kEl.textContent = k;
          metaBlock.appendChild(kEl);
          const vEl = document.createElement("div");
          vEl.className = "rt-v rt-mono";
          vEl.textContent = v;
          metaBlock.appendChild(vEl);
        }
        body.appendChild(metaBlock);

        // Drilldown actions.
        const actions = document.createElement("div");
        actions.style.cssText = "margin:14px 0;display:flex;gap:8px;flex-wrap:wrap;";
        if (row.kind === "run" || row.kind === "run-collection" || row.kind === "retained-case" || row.kind === "pack") {
          const btn = document.createElement("button");
          btn.className = "rt-btn rt-btn--primary";
          btn.type = "button";
          btn.textContent = "Open in dashboard";
          btn.addEventListener("click", () => {
            STATE.dashboardSource = row.relative_path;
            STATE.activePageId = "dashboard";
            highlightActiveNav();
            renderActivePage();
            closeDrawer();
          });
          actions.appendChild(btn);
        }
        body.appendChild(actions);

        // Warnings.
        if (row.warnings && row.warnings.length) {
          const warnHead = document.createElement("h3");
          warnHead.style.cssText = "margin:18px 0 8px;font-size:13px;color:var(--rt-warn);text-transform:uppercase;letter-spacing:0.14em;font-family:var(--rt-font-mono);";
          warnHead.textContent = "Warnings";
          body.appendChild(warnHead);
          for (const w of row.warnings) {
            const card = document.createElement("div");
            card.className = "rt-empty";
            card.style.background = "transparent";
            card.innerHTML = "<strong>" + escapeHtml(w.message) + ".</strong><div class=\"rt-action\">" + escapeHtml(w.next_action) + "</div>";
            body.appendChild(card);
          }
        }

        // Body.
        const reportHead = document.createElement("h3");
        reportHead.style.cssText = "margin:18px 0 8px;font-size:13px;color:var(--rt-fog-dim);text-transform:uppercase;letter-spacing:0.14em;font-family:var(--rt-font-mono);";
        reportHead.textContent = "Content";
        body.appendChild(reportHead);

        const contentEl = document.createElement("div");
        contentEl.id = "rt-drawer-content";
        contentEl.innerHTML = '<div class="rt-empty">Loading.</div>';
        body.appendChild(contentEl);

        openDrawer();

        try {
          const params = new URLSearchParams();
          params.set("workspace", STATE.activeWorkspaceId || "");
          params.set("artifact", row.id);
          const data = await fetchJson("/api/studio/report?" + params.toString());
          renderArtifactBody(contentEl, data);
        } catch (err) {
          contentEl.innerHTML = "";
          const e = document.createElement("div");
          e.className = "rt-empty";
          e.innerHTML = "<strong>No readable report.</strong><div class=\"rt-action\">" + escapeHtml(err && err.message ? err.message : String(err)) + "</div>";
          contentEl.appendChild(e);
        }
      }

      function renderArtifactBody(root, data) {
        root.innerHTML = "";
        const lbl = document.createElement("div");
        lbl.className = "rt-card-label";
        lbl.style.color = "var(--rt-fog-dim)";
        lbl.textContent = data.relative_path;
        root.appendChild(lbl);
        if (data.content_type === "markdown") {
          const md = document.createElement("div");
          md.className = "rt-md";
          md.innerHTML = renderMarkdown(data.body);
          root.appendChild(md);
        } else {
          const pre = document.createElement("pre");
          try {
            pre.textContent = JSON.stringify(JSON.parse(data.body), null, 2);
          } catch {
            pre.textContent = data.body;
          }
          root.appendChild(pre);
        }
      }

      function openDrawer() {
        document.getElementById("rt-drawer").classList.add("is-open");
        document.getElementById("rt-drawer").setAttribute("aria-hidden", "false");
        document.getElementById("rt-drawer-scrim").classList.add("is-open");
      }
      function closeDrawer() {
        document.getElementById("rt-drawer").classList.remove("is-open");
        document.getElementById("rt-drawer").setAttribute("aria-hidden", "true");
        document.getElementById("rt-drawer-scrim").classList.remove("is-open");
      }

      // -------------------------------------------------------
      // Markdown — minimal CommonMark-ish renderer (headings,
      // paragraphs, lists, fenced code, inline code, bold/italic,
      // links, simple GFM tables). Intentionally small.
      // -------------------------------------------------------

      function renderMarkdown(src) {
        const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
        const out = [];
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          // Fenced code
          const fence = line.match(/^```(.*)$/);
          if (fence) {
            const buf = [];
            i += 1;
            while (i < lines.length && !/^```/.test(lines[i])) {
              buf.push(lines[i]);
              i += 1;
            }
            i += 1;
            out.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
            continue;
          }
          // Headings
          const heading = line.match(/^(#{1,4})\s+(.*)$/);
          if (heading) {
            const lvl = heading[1].length;
            out.push("<h" + lvl + ">" + renderInline(heading[2]) + "</h" + lvl + ">");
            i += 1;
            continue;
          }
          // GFM table (header | header)
          if (/^\s*\|.+\|\s*$/.test(line) && /^\s*\|[\s:-]+\|\s*$/.test(lines[i + 1] || "")) {
            const headers = splitTableRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) {
              rows.push(splitTableRow(lines[i]));
              i += 1;
            }
            out.push(renderTable(headers, rows));
            continue;
          }
          // List
          if (/^\s*[-*]\s+/.test(line)) {
            const buf = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
              buf.push(lines[i].replace(/^\s*[-*]\s+/, ""));
              i += 1;
            }
            out.push("<ul>" + buf.map((s) => "<li>" + renderInline(s) + "</li>").join("") + "</ul>");
            continue;
          }
          // Paragraph
          if (line.trim().length === 0) {
            i += 1;
            continue;
          }
          const buf = [line];
          i += 1;
          while (i < lines.length && lines[i].trim().length > 0 && !/^#{1,4}\s+/.test(lines[i]) && !/^```/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i])) {
            buf.push(lines[i]);
            i += 1;
          }
          out.push("<p>" + renderInline(buf.join(" ")) + "</p>");
        }
        return out.join("\n");
      }

      function splitTableRow(line) {
        const trimmed = line.trim().replace(/^\||\|$/g, "");
        return trimmed.split("|").map((c) => c.trim());
      }

      function renderTable(headers, rows) {
        const head = "<thead><tr>" + headers.map((h) => "<th>" + renderInline(h) + "</th>").join("") + "</tr></thead>";
        const body = "<tbody>" + rows.map((r) => "<tr>" + r.map((c) => "<td>" + renderInline(c) + "</td>").join("") + "</tr>").join("") + "</tbody>";
        return "<table>" + head + body + "</table>";
      }

      function renderInline(text) {
        let out = escapeHtml(text);
        // inline code
        out = out.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
        // bold
        out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        // italic
        out = out.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
        // links
        out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
          return '<a href="' + escapeAttr(href) + '" rel="noopener" target="_blank">' + label + "</a>";
        });
        return out;
      }

      // -------------------------------------------------------
      // Helpers.
      // -------------------------------------------------------

      function activeWorkspace() {
        return STATE.workspaces.find((w) => w.id === STATE.activeWorkspaceId) || null;
      }

      async function fetchJson(url) {
        const res = await fetch(url, { headers: { accept: "application/json" } });
        if (!res.ok) {
          let msg = res.status + " " + res.statusText;
          try {
            const body = await res.json();
            if (body && body.message) msg = body.message;
          } catch (_e) { /* ignore */ }
          throw new Error(msg);
        }
        return res.json();
      }

      function showFatal(message) {
        const main = document.getElementById("rt-main");
        const card = document.createElement("div");
        card.className = "rt-error";
        card.textContent = message;
        main.appendChild(card);
      }

      function formatDate(iso) {
        if (!iso) return "—";
        try {
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return iso;
          const pad = (n) => String(n).padStart(2, "0");
          return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
        } catch {
          return iso;
        }
      }

      function rowStatus(row) {
        if (row.status) return String(row.status);
        if (row.meta && row.meta.support_status) return String(row.meta.support_status);
        return "";
      }

      function protocolClassFor(row) {
        if (!row || !row.meta) return "";
        return String(
          row.meta.protocol_class ||
          row.meta.semantic_class ||
          row.meta.class ||
          ""
        );
      }

      function uniqueDefined(values) {
        return Array.from(new Set(values.filter(Boolean).map(String))).sort();
      }

      function escapeHtml(value) {
        if (value == null) return "";
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function escapeAttr(v) { return escapeHtml(v); }
      function truncate(s, n) {
        if (!s) return "";
        return s.length > n ? s.slice(0, n - 1) + "…" : s;
      }

      boot();
    </script>
  </body>
</html>
