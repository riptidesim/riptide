[package]
name = "riptide-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
borsh = { version = "1.6.1", features = ["derive"] }
bs58 = "0.5.1"
clap = { version = "4.6.0", features = ["derive", "env", "unicode"] }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
solana-account = "3.2.0"
solana-client = "3.1.12"
solana-commitment-config = "3.1.1"
solana-sdk = "4.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = "3.1.0"
toml = "1.1.2"
which = "8.0.0"

litesvm = { version = "0.11.0", optional = true }

[[bin]]
name = "riptide-engine"

[features]
default = ["litesvm-backend"]
litesvm-backend = ["litesvm"]

[[example]]
name = "t7_litesvm_benchmark"

[dev-dependencies]
litesvm = "0.11.0"
tempfile = "3.27.0"
# Sprint 6 T02 — note: pyth-sdk-solana CANNOT be added as a direct
# dev-dep. The crate is built against borsh 0.10 (pre-breaking-change)
# while the engine's dep graph pins borsh 1.6 transitively through
# solana-sdk 4.0.1. Mixing the two produces a compile-time trait
# conflict (solana_address::Address carries borsh 0.10 impls through
# solana_hash, but the engine's code path expects borsh 1.6 derives).
# Instead, Sprint 6 isolates pyth-sdk-solana in a separate helper crate
# at `../pyth_consumer_test_helper/` (outside the workspace, separate
# Cargo.lock). The engine test spawns the compiled helper binary over
# stdin/stdout — see engine/tests/t23_pyth_real_layout.rs for the wire
# format and the "REAL pyth-sdk-solana consumer" acceptance test.
