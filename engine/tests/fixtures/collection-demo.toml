protocol = "lending"

[instructions]
deposit   = { action = "deposit",   amount = "amount" }
borrow    = { action = "borrow",    amount = "amount" }
repay     = { action = "repay",     amount = "amount" }
withdraw  = { action = "withdraw",  amount = "amount" }
liquidate = { action = "liquidate", amount = "repay_amount" }

[state_mapping]
"pool.total_deposits" = "tvl"
"pool.total_borrows"  = "debt"
"pool.bad_debt"       = "bad_debt"
"position.collateral" = "collateral"
"position.debt"       = "debt"
"position.liquidated" = "liquidated"

[semantics]
class = "lending.v1"

[semantics.roles.position]
source = "instruction.deposit_or_borrow"
fields.collateral_amount = "u128"
fields.debt_amount = "u128"

[semantics.roles.reserve]
source = "account.reserve"
fields.liquidity = "u128"
fields.health_factor = "u128"
fields.collateral_ratio = "u128"
fields.bad_debt_ratio = "u128"
fields.utilization = "u128"
fields.max_ltv_bps = "u64"

[semantics.roles.oracle]
source = "account.oracle"
fields.price = "u128"
fields.confidence = "u128"
fields.staleness = "u64"

[semantics.roles.liquidation_config]
source = "account.reserve"
fields.liquidation_threshold_bps = "u64"

[semantics.derived]
collateral_value = "position.collateral_amount * oracle.price"
debt_value = "position.debt_amount * oracle.price"
max_borrow_value = "collateral_value * reserve.max_ltv_bps / 10000"
liquidation_threshold_value = "collateral_value * liquidation_config.liquidation_threshold_bps / 10000"
health_factor = "liquidation_threshold_value / max(debt_value, 1)"

[semantics.collections.total_liquidity]
over = "reserves"
formula = "sum"
expr = "reserve.liquidity"

[semantics.collections.min_health_factor]
over = "reserves"
formula = "min"
expr = "reserve.health_factor"

[semantics.collections.max_utilization]
over = "reserves"
formula = "max"
expr = "reserve.utilization"

[semantics.collections.worst_health_factor]
over = "reserves"
formula = "worst"
expr = "reserve.health_factor"

[semantics.collections.worst_collateral_ratio]
over = "reserves"
formula = "worst"
expr = "reserve.collateral_ratio"

[semantics.collections.worst_bad_debt_ratio]
over = "reserves"
formula = "worst"
expr = "reserve.bad_debt_ratio"

[semantics.collections.worst_utilization]
over = "reserves"
formula = "worst"
expr = "reserve.utilization"
