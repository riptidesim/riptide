# Solend-fork lending adapter.
#
# First real adapter shipped with Riptide. Drives the safe-vs-risky demo
# end-to-end when passed via `--adapter fixtures/adapters/lending.toml`.
#
# Protocol: the forked Solend-style lending pool at
# `programs/lending_pool/`. Five lending actions + pool + per-position
# observation paths. Schema details live at `engine/src/adapter/schema.rs`.

protocol = "lending"

# Instruction → logical action. `action` must be one of the five canonical
# lending labels; `amount` names the ix argument that carries the amount.
[instructions]
deposit   = { action = "deposit",   amount = "amount" }
borrow    = { action = "borrow",    amount = "amount" }
repay     = { action = "repay",     amount = "amount" }
withdraw  = { action = "withdraw",  amount = "amount" }
liquidate = { action = "liquidate", amount = "repay_amount" }

# Account field → logical observation name. Keys are `<account>.<field>`
# dotted paths into the on-chain account hierarchy. Values are the
# engine-side observation names the lending tick loop consumes.
[state_mapping]
"pool.total_deposits" = "tvl"
"pool.total_borrows"  = "debt"
"pool.bad_debt"       = "bad_debt"
"position.collateral" = "collateral"
"position.debt"       = "debt"
"position.liquidated" = "liquidated"

# Reserved for the generic primitive. Lending adapters leave these
# empty — the primitive itself supplies the lending semantics.
[actions]

[observations]

[personas]

[semantics]
class = "lending.v1"

[semantics.roles.position]
source = "instruction.deposit_or_borrow"
fields.collateral_amount = "u128"
fields.debt_amount = "u128"

[semantics.roles.reserve]
source = "account.reserve"
fields.collateral_decimals = "u64"
fields.collateral_price = "u128"
fields.max_ltv_bps = "u64"

[semantics.roles.oracle]
source = "account.oracle"
fields.price = "u128"
fields.confidence = "u128"

[semantics.roles.liquidation_config]
source = "account.reserve"
fields.liquidation_threshold_bps = "u64"

[semantics.derived]
collateral_value = "position.collateral_amount * reserve.collateral_price"
debt_value = "position.debt_amount"
max_borrow_value = "collateral_value * reserve.max_ltv_bps / 10000"
liquidation_threshold_value = "collateral_value * liquidation_config.liquidation_threshold_bps / 10000"
health_factor = "liquidation_threshold_value / max(debt_value, 1)"

[[semantics.invariants]]
name = "bad_debt_bound"
expr = "debt_value <= collateral_value"
severity = "warn"
description = "Position debt must not exceed collateral value"

[[semantics.invariants]]
name = "ltv_below_max"
expr = "debt_value <= max_borrow_value"
severity = "warn"
description = "Position debt must not exceed max-borrow value"

[[errors]]
code = 0
label = "invalid_account_owner"
interpretation = "An account was not owned by the expected lending program."

[[errors]]
code = 1
label = "invalid_account_data"
interpretation = "An account could not be decoded as the expected lending state."

[[errors]]
code = 2
label = "missing_oracle_account"
interpretation = "The instruction did not include the required oracle account."

[[errors]]
code = 3
label = "unauthorized"
interpretation = "The signer was not authorized for the requested lending action."

[[errors]]
code = 4
label = "uninitialized_pool"
interpretation = "The lending pool account has not been initialized."

[[errors]]
code = 5
label = "uninitialized_oracle"
interpretation = "The oracle account has not been initialized."

[[errors]]
code = 6
label = "position_liquidated"
interpretation = "The position has already been liquidated."

[[errors]]
code = 7
label = "position_healthy"
interpretation = "The position is healthy and cannot be liquidated."

[[errors]]
code = 8
label = "insufficient_collateral"
interpretation = "Borrow or withdraw exceeded the position collateral constraint."

[[errors]]
code = 9
label = "insufficient_liquidity"
interpretation = "The pool does not have enough available liquidity."

[[errors]]
code = 10
label = "deposit_limit_exceeded"
interpretation = "The deposit would exceed the pool deposit limit."

[[errors]]
code = 11
label = "borrow_limit_exceeded"
interpretation = "The borrow would exceed the pool borrow limit."

[[errors]]
code = 12
label = "math_overflow"
interpretation = "The lending program hit a checked arithmetic overflow."

# Reviewer-facing lineage metadata (inspection-only — see
# `riptide lineage lending`). Load-bearing only as documentation:
# the engine does not validate the adapter against the IDL source at
# run time. Every assumption and unsupported-field entry must be
# reviewable against the actual shipping adapter and the program
# source named under `idl_source`.
[lineage]
idl_source = "programs/lending_pool/src/state.rs"
generator = "hand-authored"
inferred_assumptions = [
  "Lending adapter variant — the lending primitive supplies the canonical deposit/borrow/repay/withdraw/liquidate dispatch table, so `[actions]` is intentionally empty and the engine does not need per-action `takes` metadata.",
  "Oracle state lives at a primitive-known account path (admin-mock layout baked into `programs/lending_pool`) — no `[[oracles]]` declaration is needed because the primitive, not the generic harness, owns oracle bootstrap.",
  "`position.debt` and `pool.total_borrows` both bind to the engine-side `debt` observation; the lending primitive disambiguates them by the account scope of the dotted key.",
  "`liquidate` consumes the `repay_amount` argument as the runtime-bound amount (Solend-style repay-on-liquidate), not a separate debt target.",
]
unsupported_fields = [
  "LendingInstructionData::InitializeOracle — admin setup, primitive handles oracle bootstrap",
  "LendingInstructionData::SetOraclePrice — admin/scenario surface, driven by the engine's oracle shock path, not by persona dispatch",
  "LendingInstructionData::InitializePool — admin setup, primitive seeds pool state on bootstrap",
  "LendingPoolState::ltv_bps / liquidation_threshold_bps / liquidation_bonus_bps / interest_bps / deposit_limit / borrow_limit — config fields surfaced in the pool snapshot but not mapped as persona-dispatchable observations (risk-parameter sweeps live in scenario proposals, not the adapter)",
  "OracleState.reserved — 8-byte reserved padding, not part of the logical observation surface",
]
