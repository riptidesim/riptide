# Perps-fork generic adapter.
#
# The first non-lending protocol-class bundle. Drives
# `programs/perpetuals/` through the engine's generic primitive path.
#
# **Scope calls for this shipping adapter:**
#
# - `protocol = "generic"` (not `"perps"`). The `Protocol` enum has
# `Lending` and `Generic` variants today. The scenarios skill's
# `classify.md` discrimination hooks read instruction/observation
# names — not the protocol field — so the classification story works
# end-to-end under the generic variant. A later bundle can add
# `Protocol::Perps` when something actually depends on it.
# - Runtime-dispatchable actions here are **`deposit` and `withdraw`**.
# The generic runtime can also encode multi-arg instructions
# (`open_position(side, leverage_bps, notional)`) via persona_args +
# literal `[instructions].<ix>.args` entries (see
# `engine/tests/multi_arg_dispatch.rs`); this adapter deliberately
# maps only the single-arg flows because the perps scratch sidecar
# uses personas that fire `deposit`/`withdraw`. The full
# initialize → deposit → open → shock → close flow — including the
# generic push-oracle write path — runs as an integration proof in
# `engine/tests/perps_sibling_oracle_proof.rs`, which bootstraps a
# sibling-owned admin-mock oracle account and dispatches the raw
# perps instructions against LiteSVM.
# - Oracle account is NOT declared in `[accounts]` on this shipping
# adapter because none of the runtime-dispatched actions above read
# the oracle. The generic harness can now bind a shared oracle
# account to an external owner (`owner.program_so = ".../admin_mock_oracle.so"`
# or `owner.pubkey = "<base58>"`) and bootstrap it with real
# admin-mock bytes at tick 0; that surface is exercised by
# the proof test cited above. Declaring it here would work and the
# harness would honour the sibling-program ownership — the reason
# this file leaves it out is scope, not capability.
# - `[[scheduled_actions]]` is **empty**. The engine-triggered actions
# infrastructure is load-bearing: the adapter parses with zero
# scheduled actions, `Primitive::on_scheduled_action`'s default
# no-op hook handles the path, and a later bundle can declare
# `update_funding_rate` here without reshaping engine code.
# - `[invariants]` lives inline below; the two checks declared are
# the shipping invariants for this adapter. The perps scratch script
# only appends persona TOMLs at merge time (see
# `# === SIDECAR-CUT ===` below) — it does not inject additional
# invariants.
# - `[semantics].class = "perps-margin.v1"` gives the generic runtime
# an economic reading without claiming Mango/Drift/Jupiter fidelity.
# The oracle, funding, liquidation, and insurance roles below are
# bound only to fields this fixture already exports. Price is a neutral
# `position.entry_price` proxy, funding is an open-interest imbalance
# proxy, and insurance coverage is a market-collateral/socialized-loss
# proxy; none of these are live protocol subsystems in the shipped
# deposit/withdraw smoke path.
#
# **What the generic oracle surface here does NOT yet cover:**
# - more than one `[[oracles]]` entry per adapter (loader rejects 2+
# today with a clear single-oracle-for-now error)
# - pairwise generic liquidation: `GenericHarness::execute_action`
# still ignores `target_idx`, so `liquidate_position`'s victim
# plumbing is a follow-up
# - liquid-staking itself — the oracle path is the substrate, not the
# bundle
#
# Layer 2 personas — the persona library (`leveraged-long.toml`,
# `leveraged-short.toml`, `delta-neutral-farmer.toml`, `liquidator.toml`)
# — live at `fixtures/personas/*.toml`. `scripts/perps-scratch.sh`
# merges them into a runtime copy of this adapter with inline
# `[personas]` before invoking the engine.

protocol = "generic"
program_so = "../../programs/perpetuals/target/deploy/perpetuals.so"
idl_path = "../idls/perpetuals.json"

[accounts.market]
kind = "shared"
space = 113

[accounts.position]
kind = "agent"
space = 106

# deposit_collateral and withdraw_collateral are mapped as the shipping
# runtime actions. open_position / close_position / liquidate_position
# stay declared in the IDL (classification surface) but are not mapped
# here because the perps-scratch scratch driver doesn't dispatch them;
# the full open→shock→close flow is covered by the integration proof at
# `engine/tests/perps_sibling_oracle_proof.rs`.
[instructions]
deposit_collateral  = { action = "deposit",  amount = "amount" }
withdraw_collateral = { action = "withdraw", amount = "amount" }

[state_mapping]
"market.max_leverage_bps"          = "market.max_leverage_bps"
"market.liquidation_threshold_bps" = "market.liquidation_threshold_bps"
"market.total_oi_long"             = "market.total_oi_long"
"market.total_oi_short"            = "market.total_oi_short"
"market.total_collateral"          = "market.total_collateral"
"market.cumulative_socialized_loss" = "market.cumulative_socialized_loss"
"position.side"       = "position.side"
"position.collateral" = "position.collateral"
"position.notional"   = "position.notional"
"position.entry_price" = "position.entry_price"
"position.leverage_bps" = "position.leverage_bps"
"position.liquidated" = "position.liquidated"

[actions.deposit]
label = "Deposit collateral"
takes = ["amount"]

[actions.withdraw]
label = "Withdraw collateral"
takes = ["amount"]

[observations]
"market.max_leverage_bps"           = "uint"
"market.liquidation_threshold_bps"  = "uint"
"market.total_oi_long"              = "uint"
"market.total_oi_short"             = "uint"
"market.total_collateral"           = "uint"
"market.cumulative_socialized_loss" = "uint"
"position.side"                     = "uint"
"position.collateral"               = "uint"
"position.notional"                 = "uint"
"position.entry_price"              = "uint"
"position.leverage_bps"             = "uint"
"position.liquidated"               = "bool"

[[invariants]]
name = "no_socialized_loss"
field = "market.cumulative_socialized_loss"
op = "=="
value = 0

[[invariants]]
name = "max_leverage_respected"
field = "position.leverage_bps"
op = "<="
value = 100000

[semantics]
class = "perps-margin.v1"

# Runtime dispatch in this shipped fixture is deposit/withdraw only.
# These roles therefore describe the observable margin-account surface
# and proxy risk inputs, not a full perps venue implementation.
[semantics.roles.margin_account]
source = "account.position"
fields.collateral = "u128"

[semantics.roles.collateral]
source = "account.position"
fields.collateral = "u128"

[semantics.roles.perp_position]
source = "account.position"
fields.notional = "u128"
fields.entry_price = "u128"
fields.leverage_bps = "u128"
fields.side = "u128"

# Proxy price role: the shipping adapter does not bind an oracle account
# because deposit/withdraw do not read one. Reusing entry_price keeps
# unrealized PnL neutral and tick-0-safe for this smoke fixture.
[semantics.roles.oracle]
source = "account.position"
fields.entry_price = "u128"

# Proxy funding role: no funding-rate update action is scheduled here.
# The imbalance inputs below are observable open-interest fields only.
[semantics.roles.funding_config]
source = "account.market"
fields.total_oi_long = "u128"
fields.total_oi_short = "u128"

[semantics.roles.liquidation_config]
source = "account.market"
fields.liquidation_threshold_bps = "u128"
fields.max_leverage_bps = "u128"

# Proxy insurance role: the fixture exposes aggregate collateral and
# cumulative socialized loss, not a real insurance-fund account.
[semantics.roles.insurance_fund]
source = "account.market"
fields.total_collateral = "u128"
fields.cumulative_socialized_loss = "u128"

[semantics.derived]
unrealized_pnl = "0"
account_equity = "margin_account.collateral + unrealized_pnl"
initial_margin_requirement = "perp_position.notional * 10000 / max(liquidation_config.max_leverage_bps, 1)"
maintenance_margin_requirement = "perp_position.notional * liquidation_config.liquidation_threshold_bps / 10000"
margin_ratio = "account_equity * 10000 / max(perp_position.notional, 1)"
liquidation_buffer = "max(account_equity, maintenance_margin_requirement) - maintenance_margin_requirement"
funding_payment = "perp_position.notional * (max(funding_config.total_oi_long, funding_config.total_oi_short) - min(funding_config.total_oi_long, funding_config.total_oi_short)) / max(funding_config.total_oi_long + funding_config.total_oi_short, 1)"
insurance_coverage = "max(insurance_fund.total_collateral, insurance_fund.cumulative_socialized_loss) - insurance_fund.cumulative_socialized_loss"

[[semantics.invariants]]
name = "margin_above_maintenance_proxy"
expr = "maintenance_margin_requirement <= account_equity"
severity = "warn"
description = "Proxy margin equity should remain above the maintenance requirement implied by observable position and market fields."

[[semantics.invariants]]
name = "liquidation_buffer_nonnegative_proxy"
expr = "account_equity >= maintenance_margin_requirement"
severity = "warn"
description = "Proxy liquidation buffer should not go negative over the shipped deposit/withdraw surface."

[[semantics.invariants]]
name = "funding_payment_bounded_proxy"
expr = "abs(funding_payment) <= perp_position.notional"
severity = "warn"
description = "Proxy funding payment from open-interest imbalance should not exceed observable notional."

[[semantics.invariants]]
name = "oracle_divergence_bounded_proxy"
expr = "max(oracle.entry_price, perp_position.entry_price) - min(oracle.entry_price, perp_position.entry_price) <= max(perp_position.entry_price, 1)"
severity = "warn"
description = "Proxy oracle price should not diverge from the fixture mark/entry price over the shipped smoke surface."

[[semantics.invariants]]
name = "insurance_coverage_nonnegative_proxy"
expr = "insurance_fund.cumulative_socialized_loss <= insurance_fund.total_collateral"
severity = "warn"
description = "Proxy insurance coverage, computed from market collateral less socialized loss, should remain nonnegative."

# The `market_config_initialized` invariant
# (`market.max_leverage_bps > 0`) was intentionally omitted: it fires
# once at tick 0 before the generic harness's lazy market-init path,
# which would turn the perps scratch gate red on a check that is
# exploratory rather than load-bearing. Harness-level eager market
# init — or a scheduled action that fires `initialize_market` at
# tick 0 — remains a follow-up. The two shipping checks below are
# `no_socialized_loss` and `max_leverage_respected`.

# === SIDECAR-CUT ===
# `scripts/perps-scratch.sh` truncates this file at the
# `# === SIDECAR-CUT ===` line above and appends
# `fixtures/personas/*.toml` for the real perps persona library
# (leveraged-long, leveraged-short, delta-neutral-farmer, liquidator)
# before handing the result to the engine. The block below is the
# smoke-test persona set used by `riptide adapt --adapter …` with
# names that match `cli/src/adapt/smoke.ts`'s generic run-config
# (`grinder` / `botter` / `casual`), so the shipping adapter clears
# the smoke gate without CLI changes.
[personas.grinder]
label = "Perps baseline (smoke)"
action_rate_multiplier = 1.0
action_weights = { deposit = 0.9, withdraw = 0.1 }
triggers = []

[personas.botter]
label = "Perps high-rate (smoke)"
action_rate_multiplier = 2.0
action_weights = { deposit = 0.7, withdraw = 0.3 }
triggers = []

[personas.casual]
label = "Perps low-rate (smoke)"
action_rate_multiplier = 0.5
action_weights = { deposit = 0.5, withdraw = 0.5 }
triggers = []

# Reviewer-facing lineage metadata (inspection-only — see
# `riptide lineage perpetuals`). Every assumption and unsupported-field
# entry is reviewable against `fixtures/idls/perpetuals.json` and the
# program source under `programs/perpetuals/`.
[lineage]
idl_source = "fixtures/idls/perpetuals.json"
generator = "hand-authored"
inferred_assumptions = [
  "`protocol = \"generic\"` instead of a dedicated `Protocol::Perps` variant — the classification surface reads instruction and observation names, not the protocol enum, so a perps-specific variant would only be cosmetic.",
  "Only single-arg instructions (`deposit_collateral`, `withdraw_collateral`) are mapped as runtime-dispatchable actions; `open_position` / `close_position` / `liquidate_position` stay IDL-only for classification but are dispatched in the `perps_sibling_oracle_proof` integration test, not via persona draws.",
  "`initialize_market` is not mapped as a runtime action; the generic harness handles market state via its bootstrap path rather than racing persona draws through admin setup.",
  "The `market_config_initialized` (`market.max_leverage_bps > 0`) invariant is intentionally omitted because it fires once at tick 0 before lazy market init — this adapter leaves it to a future harness-level eager-init or a tick-0-skip invariant operator.",
  "No `[[oracles]]` block on this shipping adapter because none of the two runtime-dispatched actions (`deposit` / `withdraw`) reads the oracle account; the oracle path is exercised for perps via `engine/tests/perps_sibling_oracle_proof.rs`, not via this adapter's smoke surface.",
  "No `[[scheduled_actions]]` block: perps funding-rate updates and insurance-fund rebalances are deliberately out of scope.",
]
unsupported_fields = [
  "instruction `initialize_market` — admin setup, handled by bootstrap not persona dispatch",
  "instruction `open_position(side, leverage_bps, notional)` — full multi-arg trade flow not dispatched from personas; covered by perps_sibling_oracle_proof",
  "instruction `close_position` — terminal position flow, same reason as `open_position`",
  "instruction `liquidate_position` — pairwise `target_idx` plumbing in `GenericHarness::execute_action` is still a follow-up",
  "account `market.is_initialized` / `market.admin` / `market.oracle` — bootstrap and pubkey metadata, not part of the logical persona-observable surface",
  "account `position.owner` / `position.market` / `position.is_initialized` — pubkey/bool bootstrap metadata, not persona-observable",
  "funding rate and insurance fund — deliberately out of scope for this fork (documented in the IDL description)",
]
