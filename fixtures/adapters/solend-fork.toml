# Solend-fork lending adapter.
#
# First real adapter shipped with Riptide. Drives the safe-vs-risky demo
# end-to-end when passed via `--adapter fixtures/adapters/solend-fork.toml`.
#
# Protocol: the forked Solend-style lending pool at
# `programs/lending_pool/`. Five lending actions + pool + per-position
# observation paths. Schema details live at `engine/src/adapter/schema.rs`.

protocol = "lending"

# Instruction → logical action. `action` must be one of the five canonical
# lending labels; `amount` names the ix argument that carries the amount.
[instructions]
deposit   = { action = "deposit",   amount = "amount" }
borrow    = { action = "borrow",    amount = "amount" }
repay     = { action = "repay",     amount = "amount" }
withdraw  = { action = "withdraw",  amount = "amount" }
liquidate = { action = "liquidate", amount = "repay_amount" }

# Account field → logical observation name. Keys are `<account>.<field>`
# dotted paths into the on-chain account hierarchy. Values are the
# engine-side observation names the lending tick loop consumes.
[state_mapping]
"pool.total_deposits" = "tvl"
"pool.total_borrows"  = "debt"
"pool.bad_debt"       = "bad_debt"
"position.collateral" = "collateral"
"position.debt"       = "debt"
"position.liquidated" = "liquidated"

# Reserved for the generic primitive. Lending adapters leave these
# empty — the primitive itself supplies the lending semantics.
[actions]

[observations]

[personas]

# Reviewer-facing lineage metadata (inspection-only — see
# `riptide lineage solend-fork`). Load-bearing only as documentation:
# the engine does not validate the adapter against the IDL source at
# run time. Every assumption and unsupported-field entry must be
# reviewable against the actual shipping adapter and the program
# source named under `idl_source`.
[lineage]
idl_source = "programs/lending_pool/src/state.rs"
generator = "hand-authored"
inferred_assumptions = [
  "Lending adapter variant — the solend-fork primitive supplies the canonical deposit/borrow/repay/withdraw/liquidate dispatch table, so `[actions]` is intentionally empty and the engine does not need per-action `takes` metadata.",
  "Oracle state lives at a primitive-known account path (admin-mock layout baked into `programs/lending_pool`) — no `[[oracles]]` declaration is needed because the primitive, not the generic harness, owns oracle bootstrap.",
  "`position.debt` and `pool.total_borrows` both bind to the engine-side `debt` observation; the lending primitive disambiguates them by the account scope of the dotted key.",
  "`liquidate` consumes the `repay_amount` argument as the runtime-bound amount (Solend-style repay-on-liquidate), not a separate debt target.",
]
unsupported_fields = [
  "LendingInstructionData::InitializeOracle — admin setup, primitive handles oracle bootstrap",
  "LendingInstructionData::SetOraclePrice — admin/scenario surface, driven by the engine's oracle shock path, not by persona dispatch",
  "LendingInstructionData::InitializePool — admin setup, primitive seeds pool state on bootstrap",
  "LendingPoolState::ltv_bps / liquidation_threshold_bps / liquidation_bonus_bps / interest_bps / deposit_limit / borrow_limit — config fields surfaced in the pool snapshot but not mapped as persona-dispatchable observations (risk-parameter sweeps live in scenario proposals, not the adapter)",
  "OracleState.reserved — 8-byte reserved padding, not part of the logical observation surface",
]
