# Stablecoin-fork generic adapter.
#
# Fifth protocol-class bundle after lending / perps / AMM / liquid-
# staking. Drives `programs/stablecoin/` through the engine's
# generic primitive path.
#
# **Scope calls for this shipping adapter:**
#
# - `protocol = "generic"`. Same rationale as the last three bundles:
#   `Protocol::Stablecoin` would be a cosmetic ripple. The scenarios
#   skill's classification hooks read instruction / observation names,
#   so stablecoin-specific category hooks (collateral_ratio_spiral,
#   redemption_run, hedge_gap_depeg, reserve_buffer_exhaustion) work
#   via name matching without a new protocol variant.
# - Runtime-dispatchable actions: `deposit_collateral` (single u64),
#   `mint_stable` (single u64), `request_redeem` (single u64),
#   `claim_redeem` (zero-arg). `initialize_pool` is IDL-only — the
#   processor's lazy-init path seeds defaults on first touch, so
#   mapping it as a runtime action would race every agent to re-init
#   and fail with `PoolAlreadyInitialized` (same precedent as amm
#   and liquid-staking).
# - `apply_hedge_loss` is admin-gated and not runtime-dispatchable
#   from persona draws. It is the single stress mutation that drives
#   UXD-style collateral-cascade / under-backed scenarios — the named
#   proof path under `fixtures/replays/` dispatches it directly via
#   the replay trajectory; the shipping smoke scenario leaves
#   `[[scheduled_actions]]` empty. The real UXD failure carried its
#   delta hedge on an off-program venue (Mango); this adapter
#   internalizes the hedge-gap as a program-local mutation rather
#   than pretending to integrate a live perps venue. That constraint
#   is called out in the lineage block below and will be mirrored in
#   the bundle's proof README.
# - `[[oracles]]` binds **one** externally-owned admin-mock oracle
#   account through the generic adapter's owner-aware oracle path: the
#   stablecoin bundle boots against the real externally-owned
#   shared-oracle surface, not a bundle-local shortcut. The program
#   does not currently read the oracle (backing is driven by
#   on-account state only), but the adapter
#   binding is still honest — the account is created with sibling-
#   program ownership at tick 0, not `program_id`, and the
#   `push_oracle_price` path from the scenario harness still lands
#   real admin-mock bytes on it. Declaring it here exercises the full
#   owner-aware binding surface for the bundle. A later bundle can
#   add an oracle-sanity hook without reshaping this file.
# - **Scope call: admin-mock only.** `kind = "admin-mock"` keeps
#   the oracle bootstrap minimal for the MVP.
# - `pool` is a shared account, `position` is per-agent — same account
#   kinds amm (`pool` shared, `lp_position` agent) and
#   liquid-staking (`pool` shared, `stake_account` agent) use.
#
# **Shipping invariants are tick-0-safe and structural only.**
# Economically meaningful floor invariants (e.g. `effective_collateral_ratio_bps
# >= 10_000`) would technically pass at tick 0 (lazy-init pins the
# ratio to 10_000 on a zero-supply pool), but they can still false-fire
# mid-smoke in the zero-byte bootstrap path before the processor seeds
# defaults. The shipping adapter therefore carries only structural
# bounds; the named UXD-style collateral-cascade proof artifact
# under `fixtures/replays/` carries the real under-backed floor
# invariant against explicitly-initialized state.

protocol = "generic"
program_so = "../../programs/stablecoin/target/deploy/stablecoin.so"
idl_path = "../idls/stablecoin.json"

[accounts.pool]
kind = "shared"
space = 121

[accounts.position]
kind = "agent"
space = 105

# Externally-owned oracle account. The generic harness bootstraps this
# at tick 0 with real admin-mock bytes under the sibling-program's
# ownership — NOT under stablecoin's program_id. This is the
# honest owner-aware oracle path; the admin-mock owner is resolved
# from the companion keypair that ships next to `admin_mock_oracle.so`.
[accounts.oracle]
kind = "shared"
space = 50
owner = { program_so = "../../programs/admin_mock_oracle/target/deploy/admin_mock_oracle.so" }

# Runtime-dispatchable actions. All four are single-arg u64 or
# zero-arg — no multi-arg builder needed for the stablecoin surface.
[instructions]
deposit_collateral = { action = "deposit_collateral", amount = "amount" }
mint_stable        = { action = "mint_stable",        amount = "amount" }
request_redeem     = { action = "request_redeem",     amount = "stable_amount" }
claim_redeem       = { action = "claim_redeem" }

[state_mapping]
"pool.collateral_assets"              = "pool.collateral_assets"
"pool.stable_supply"                  = "pool.stable_supply"
"pool.reserve_buffer_assets"          = "pool.reserve_buffer_assets"
"pool.pending_redemption_assets"      = "pool.pending_redemption_assets"
"pool.pending_redemption_count"       = "pool.pending_redemption_count"
"pool.effective_collateral_ratio_bps" = "pool.effective_collateral_ratio_bps"
"pool.cumulative_hedge_loss_bps"      = "pool.cumulative_hedge_loss_bps"
"position.collateral_deposited"   = "position.collateral_deposited"
"position.stable_minted"          = "position.stable_minted"
"position.pending_redeem_assets"  = "position.pending_redeem_assets"
"position.claimable_collateral"   = "position.claimable_collateral"
"position.cumulative_claimed"     = "position.cumulative_claimed"

[actions.deposit_collateral]
label = "Deposit collateral into the stablecoin pool"
takes = ["amount"]

[actions.mint_stable]
label = "Mint stablecoins against already-deposited collateral"
takes = ["amount"]

[actions.request_redeem]
label = "Burn stablecoins, post a redemption claim (covered from reserve or queued)"
takes = ["stable_amount"]

[actions.claim_redeem]
label = "Flush claimable and settle queued entries if reserve covers them"
takes = []

[observations]
"pool.collateral_assets"              = "uint"
"pool.stable_supply"                  = "uint"
"pool.reserve_buffer_assets"          = "uint"
"pool.pending_redemption_assets"      = "uint"
"pool.pending_redemption_count"       = "uint"
"pool.effective_collateral_ratio_bps" = "uint"
"pool.cumulative_hedge_loss_bps"      = "uint"
"position.collateral_deposited"   = "uint"
"position.stable_minted"          = "uint"
"position.pending_redeem_assets"  = "uint"
"position.claimable_collateral"   = "uint"
"position.cumulative_claimed"     = "uint"

[semantics]
class = "stablecoin.v1"

[semantics.roles.collateral_pool]
source = "account.pool"
fields.collateral_assets = "u128"
fields.effective_collateral_ratio_bps = "u64"

[semantics.roles.liabilities]
source = "account.pool"
fields.stable_supply = "u128"

# The shipped processor does not read the externally-owned admin-mock
# oracle yet. For stablecoin.v1's oracle/backing-source role, bind the
# program-local effective backing ratio the processor actually exposes.
# The top-level `[[oracles]]` block still exercises owner-aware oracle
# bootstrap, but it is not a semantic price input yet.
[semantics.roles.oracle]
source = "account.pool"
fields.effective_collateral_ratio_bps = "u64"

[semantics.roles.redemption_queue]
source = "account.pool"
fields.pending_redemption_assets = "u128"
fields.pending_redemption_count = "u64"

[semantics.roles.backing_module]
source = "account.pool"
fields.reserve_buffer_assets = "u128"
fields.cumulative_hedge_loss_bps = "u64"

# Program-local peg proxy: the fixture exposes effective backing ratio,
# not an external market price. `peg_deviation_bps` below is therefore a
# backing-ratio deviation from par, not a traded-price depeg measure.
[semantics.roles.peg_config]
source = "account.pool"
fields.effective_collateral_ratio_bps = "u64"

[semantics.derived]
collateral_value = "collateral_pool.collateral_assets"
liability_value = "liabilities.stable_supply"
backing_ratio = "collateral_value * 10000 / max(liability_value, 1)"
collateralization_ratio = "collateral_pool.effective_collateral_ratio_bps"
redemption_pressure = "redemption_queue.pending_redemption_assets * 10000 / max(liability_value, 1)"
redemption_coverage_ratio = "backing_module.reserve_buffer_assets * 10000 / max(redemption_queue.pending_redemption_assets, 1)"
peg_deviation_bps = "max(10000, peg_config.effective_collateral_ratio_bps) - min(10000, peg_config.effective_collateral_ratio_bps)"
hedge_gap_value = "collateral_pool.collateral_assets * backing_module.cumulative_hedge_loss_bps / 10000"

[[semantics.invariants]]
name = "collateral_value_covers_liability_value"
expr = "collateral_value >= liability_value"
severity = "warn"
description = "Program-local collateral value should cover issued stablecoin liabilities"

[[semantics.invariants]]
name = "redemptions_within_collateral_value"
expr = "redemption_queue.pending_redemption_assets <= collateral_value"
severity = "warn"
description = "Queued redemption claims should not exceed remaining program-local collateral"

[[semantics.invariants]]
name = "hedge_gap_within_collateral_value"
expr = "hedge_gap_value <= collateral_value"
severity = "warn"
description = "Program-local hedge-loss proxy should stay bounded by current collateral"

# Shipping invariants.
#
# `no_hedge_loss_during_healthy_run` — the scratch smoke run never
# fires `apply_hedge_loss`, so `cumulative_hedge_loss_bps` must stay at
# zero through the tick loop. Named UXD-style proof paths dispatch the
# haircut directly through a replay trajectory; that is where the
# invariant is *meant* to fire as the proof signal.
#
# `collateral_ratio_bounded` — the reported ratio must stay below a
# smoke sanity ceiling. The shipped persona mix can transiently
# over-collateralize above 10x while deposits land before matching
# mints/redemptions, so the ceiling is intentionally loose at 100x the
# nominal 10_000-bps full-backing rate. The interesting floor check
# (`effective_collateral_ratio_bps >= 10_000`) is left to the named
# proof artifact, which operates against explicitly-initialized pool
# state where the floor has honest meaning.
#
# Queue-pressure / reserve-exhaustion checks are taxonomy-level
# concerns expressed as proposal templates in the scenarios skill,
# not as inline invariants — the scratch-smoke gate does not drive
# them to fire.

[[invariants]]
name = "no_hedge_loss_during_healthy_run"
field = "pool.cumulative_hedge_loss_bps"
op = "=="
value = 0

[[invariants]]
name = "collateral_ratio_bounded"
field = "pool.effective_collateral_ratio_bps"
op = "<="
value = 1000000

# Differentiated stablecoin persona library. The four bundle personas
# below are inline mirrors of the per-file fragments at
# `fixtures/personas/stablecoin/{cautious-minter,leverage-looper,
# panic-redeemer,arb-redeemer}.toml`. Keeping them inline lets
# scenarios / replays under `fixtures/scenarios/stablecoin/` and
# `fixtures/replays/stablecoin-uxd-style-collateral-cascade/`
# reference them by name without a scratch-harness rebuild; the
# per-file fragments remain the canonical reviewer-inspection source
# and serve as the persona catalog for a future bare-adapter scratch
# harness that composes an adapter from scratch rather than mutating
# this one.

[personas.cautious-minter]
label = "Cautious minter"
action_rate_multiplier = 0.5
action_weights = { deposit_collateral = 0.8, mint_stable = 0.15, request_redeem = 0.03, claim_redeem = 0.02 }
triggers = []

[personas.leverage-looper]
label = "Leverage looper"
action_rate_multiplier = 1.5
action_weights = { deposit_collateral = 0.45, mint_stable = 0.45, request_redeem = 0.05, claim_redeem = 0.05 }
triggers = [
  { if = "pool.pending_redemption_count > 0", then = "claim_redeem", weight_boost = 1.5 },
]

[personas.panic-redeemer]
label = "Panic redeemer"
action_rate_multiplier = 1.0
action_weights = { deposit_collateral = 0.05, mint_stable = 0.05, request_redeem = 0.75, claim_redeem = 0.15 }
triggers = [
  { if = "pool.effective_collateral_ratio_bps < 10000", then = "request_redeem", weight_boost = 5.0 },
]

[personas.arb-redeemer]
label = "Arb redeemer"
action_rate_multiplier = 1.2
action_weights = { deposit_collateral = 0.1, mint_stable = 0.1, request_redeem = 0.5, claim_redeem = 0.3 }
triggers = [
  { if = "pool.pending_redemption_count > 0", then = "claim_redeem", weight_boost = 2.5 },
]

# === SIDECAR-CUT ===
# Everything below this marker is the smoke-test persona block used by
# `riptide adapt --adapter …` with names that match
# `cli/src/adapt/smoke.ts`'s generic run-config (`grinder` / `botter` /
# `casual`), so the shipping adapter clears the smoke gate without
# CLI changes. A scratch harness that wants only the bundle personas
# can truncate this file at the marker above — the resulting adapter
# is self-contained because the bundle personas already live inline
# above it. (Do NOT also append the per-file fragments from
# `fixtures/personas/stablecoin/`; they are mirrors of the same
# personas and re-appending would produce duplicate `[personas.*]`
# tables.)
#
# Smoke personas only exercise the four user flows. Weights favour
# `deposit_collateral` first so the position initializes before mint
# / request / claim attempts fire — same discipline the liquid-
# staking-fork smoke personas use (`stake` first, then request/claim).

[personas.grinder]
label = "Stablecoin baseline (smoke)"
action_rate_multiplier = 1.0
action_weights = { deposit_collateral = 0.6, mint_stable = 0.2, request_redeem = 0.15, claim_redeem = 0.05 }
triggers = []

[personas.botter]
label = "Stablecoin high-rate (smoke)"
action_rate_multiplier = 2.0
action_weights = { deposit_collateral = 0.4, mint_stable = 0.3, request_redeem = 0.2, claim_redeem = 0.1 }
triggers = []

[personas.casual]
label = "Stablecoin low-rate (smoke)"
action_rate_multiplier = 0.5
action_weights = { deposit_collateral = 0.7, mint_stable = 0.15, request_redeem = 0.1, claim_redeem = 0.05 }
triggers = []

# Reviewer-facing lineage metadata (inspection-only — see
# `riptide lineage stablecoin`). Every assumption and
# unsupported-field entry is reviewable against
# `fixtures/idls/stablecoin.json` and the program source under
# `programs/stablecoin/`.
[lineage]
idl_source = "fixtures/idls/stablecoin.json"
generator = "hand-authored"
inferred_assumptions = [
  "`protocol = \"generic\"` instead of `Protocol::Stablecoin` — classification reads instruction/observation names, so the dedicated variant would be cosmetic. Stablecoin-specific taxonomy hooks (collateral_ratio_spiral / redemption_run / hedge_gap_depeg / reserve_buffer_exhaustion) work via name matching.",
  "`initialize_pool` is not mapped as a runtime action; the processor lazy-inits the pool on first touch (zero collateral, zero supply, ratio pinned to 10_000 bps on empty supply), so runtime dispatch would race every agent into `PoolAlreadyInitialized` errors (same precedent as amm and liquid-staking).",
  "`apply_hedge_loss` is admin-gated and not mapped for persona dispatch. The UXD-style collateral-cascade proof path calls it directly through a replay trajectory; the shipping smoke scenario leaves `[[scheduled_actions]]` empty. Real UXD carried its delta hedge on an off-program venue — this adapter internalizes hedge-gap as a narrow program-local mutation rather than claiming live venue integration.",
  "`claim_redeem` is zero-arg: `[instructions].claim_redeem` omits the `amount` binding and the corresponding action has an empty `takes`, exercising the generic primitive's zero-arg dispatch path.",
  "Mint is 1:1 against deposited collateral (position.free_collateral >= amount). Redemption pays 1:1 back. The under-backed regime manifests at the pool level (collateral_assets < stable_supply, effective_collateral_ratio_bps < 10_000) after `apply_hedge_loss` lands, rather than through a dynamic mint/redeem price. This is the honest program-local substitute for real UXD mint/redeem pricing — captured as pressure geometry, not protocol fidelity.",
  "The `[[oracles]]` entry binds an externally-owned admin-mock price account for forward compat — the shipping stablecoin processor does NOT currently read it (backing is driven by on-account state). The binding still honestly exercises the owner-aware oracle path at tick 0.",
  "`kind = \"admin-mock\"` — minimal MVP oracle bootstrap; protocol-specific oracle layouts belong in the project harness.",
  "Shipping invariants are tick-0-safe and structural only. The economically meaningful floor invariant (`effective_collateral_ratio_bps >= 10_000`) lives in the named UXD-style proof artifact under `fixtures/replays/`, which operates against explicitly-initialized pool state where the floor has honest meaning. The `collateral_ratio_bounded` ceiling (100_000 bps = 10x nominal) is an anti-runaway sanity check.",
]
unsupported_fields = [
  "instruction `initialize_pool` — admin setup, handled by lazy init",
  "instruction `apply_hedge_loss(loss_bps)` — admin-gated stress mutation, dispatched via replay trajectory, not persona draws",
  "account `pool.admin` / `pool.oracle` / `pool.is_initialized` — pubkey/bool metadata, not persona-observable",
  "account `position.owner` / `position.pool` / `position.is_initialized` — pubkey/bool metadata, not persona-observable",
  "dynamic mint/redeem pricing against the bound oracle — the current processor treats mint/redeem as 1:1 and lets the hedge-loss haircut land on pool collateral instead. A later bundle can add oracle-gated pricing without reshaping this file.",
  "real hedge-venue plumbing — the UXD-style failure geometry is captured as a narrow program-local mutation (apply_hedge_loss). A live perps-hedge + stablecoin composition would require cross-program replay work that is explicitly out of scope for this bundle.",
]

[[oracles]]
name = "stablecoin_nav_feed"
kind = "admin-mock"
account = "oracle"
base_price = 1.0
exponent = -2
