[package]
name = "contribution-pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = "1.5"
solana-program = "2.3.0"

# `solana_program::entrypoint!` expands `cfg(feature = "custom-heap")`,
# `cfg(feature = "custom-panic")`, and `cfg(target_os = "solana")` from the
# defining crate, which the consuming crate does not declare. Allowed here so
# `cargo clippy -- -W clippy::all` is clean on fixture code we own.
[lints.rust]
unexpected_cfgs = "allow"

[workspace]
