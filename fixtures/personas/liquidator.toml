# Perps persona — liquidator.
#
# Sprint 5 T09. In full perps this persona watches for positions
# below the maintenance-margin threshold and calls
# `liquidate_position`. Sprint 5 perps-lite cannot runtime-dispatch
# that instruction (see the T08 adapter scope note), so the
# liquidator is expressed as "waits for a liquidated victim, then
# withdraws the seized balance" — a weight/trigger shape that still
# exercises the `position.liquidated` observation the T12 invariants
# read.

[personas.liquidator]
label = "Liquidator"
action_rate_multiplier = 0.8
action_weights = { deposit = 0.2, withdraw = 1.0 }
triggers = [
  { if = "position.liquidated == true", then = "withdraw", weight_boost = 4.0 },
]
