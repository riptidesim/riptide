# AMM persona — sandwich-attacker (approximate).
#
#. Real sandwich attacks require mempool visibility + tx
# ordering control, which Riptide does not model at. This
# persona approximates the failure shape as *bursty one-directional
# swap activity around volume surges* — the on-chain footprint that
# would remain once the mempool-side mechanics are stripped. Fires when
# `pool.cumulative_volume` grows past a threshold, which is how the
# `jit_liquidity` and `price_manipulation_via_swap` hooks detect
# the pattern.
[personas.sandwich-attacker]
label = "Sandwich attacker (approximate)"
action_rate_multiplier = 2.0
action_weights = { add_liquidity = 0.0, swap = 1.0, remove_liquidity = 0.0 }
triggers = [
  { if = "pool.cumulative_volume > 50000", then = "swap", weight_boost = 4.0 },
  { if = "pool.last_swap_price > 1010000", then = "swap", weight_boost = 3.0 },
]
persona_args = { amount_b = 0, direction = 1 }
