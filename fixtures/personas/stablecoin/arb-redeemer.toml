# Stablecoin persona — arb redeemer.
#
# Standalone TOML fragment. Canonical reviewer-inspection source for
# the persona mirrored inline into `fixtures/adapters/stablecoin-fork.toml`
# above that file's `# === SIDECAR-CUT ===` marker. A future
# bare-adapter scratch harness that wants to compose an adapter from
# scratch (not from the shipping adapter) can concatenate this file
# alongside its siblings; it must NOT be appended to the shipping
# adapter, which already carries the same persona inline and would
# fail to load with a duplicate-key error.
#
# Queue-aware churner. Splits weight between `request_redeem` and
# `claim_redeem` so the persona both contributes to redemption
# pressure AND sweeps whatever reserve refills between ticks. The
# pending-queue trigger boosts `claim_redeem` weight whenever the
# pool has a non-zero queue — modelling the arbitrageur who watches
# for reserve-refill moments and settles their share ahead of the
# queued population.
#
# Mirrors liquid-staking-fork's arb-redeemer in cadence
# (`action_rate_multiplier = 1.2`, split redemption weight, queue-sweep
# trigger). The hook moved from `pool.pending_unstake_count` to
# `pool.pending_redemption_count`.
[personas.arb-redeemer]
label = "Arb redeemer"
action_rate_multiplier = 1.2
action_weights = { deposit_collateral = 0.1, mint_stable = 0.1, request_redeem = 0.5, claim_redeem = 0.3 }
triggers = [
  { if = "pool.pending_redemption_count > 0", then = "claim_redeem", weight_boost = 2.5 },
]
