# Solend-fork lending adapter — Euler-shape replay variant.
#
# Identical to `fixtures/adapters/lending.toml` except for two additions:
# - the optional `donate` instruction is declared in `[instructions]`,
#   so the on-chain `LendingInstructionData::Donate` variant is reachable
#   from this replay's trajectory.
# - the trailing `[[invariants]]` block ships `no_bad_debt` so the
#   replay can prove "bad-debt invariant fires at the cascade tick" on
#   a CI gate, rather than only surfacing bad-debt accrual as a number.
#
# **Why a replay-specific adapter.** Adding `donate` or `no_bad_debt` to
# the shipped `fixtures/adapters/lending.toml` would change the output
# shape of every lending run. The hero-grid hash
# `89ca84209f3423c317e6be96f14261a9ebed7a9668398a08087a25631b782a11`
# (`w25-s40` cell) and the lending-whale-bad-debt replay
# `result_sha256 = 6c59db5ebf916c8cc068c8fea8727d4edf26d244f288f6dadd7e9ae47d16c4a1`
# both depend on that adapter staying clean. Keeping the additions
# scoped to this replay fixture preserves both hashes while satisfying
# the credibility claim that the `no_bad_debt` invariant fires at the
# expected tick on a donate-and-liquidate sequence.
#
# Historical inspiration: the March 2023 Euler Finance exploit on
# Ethereum, which combined `donateToReserves` (collateral leaves the
# donor's position without an LTV recheck) with a same-actor liquidation
# to convert the underwater donor's debt into protocol bad debt. This
# pack does NOT reconstruct Euler's bytecode — it reproduces the
# economic geometry on Riptide's Solana lending toy program. See
# README.md for the full boundary.

protocol = "lending"

[instructions]
deposit   = { action = "deposit",   amount = "amount" }
borrow    = { action = "borrow",    amount = "amount" }
repay     = { action = "repay",     amount = "amount" }
withdraw  = { action = "withdraw",  amount = "amount" }
liquidate = { action = "liquidate", amount = "repay_amount" }
donate    = { action = "donate",    amount = "amount" }

[state_mapping]
"pool.total_deposits" = "tvl"
"pool.total_borrows"  = "debt"
"pool.bad_debt"       = "bad_debt"
"position.collateral" = "collateral"
"position.debt"       = "debt"
"position.liquidated" = "liquidated"

[actions]

[observations]

[personas]

[[errors]]
code = 0
label = "invalid_account_owner"
interpretation = "An account was not owned by the expected lending program."

[[errors]]
code = 1
label = "invalid_account_data"
interpretation = "An account could not be decoded as the expected lending state."

[[errors]]
code = 2
label = "missing_oracle_account"
interpretation = "The instruction did not include the required oracle account."

[[errors]]
code = 3
label = "unauthorized"
interpretation = "The signer was not authorized for the requested lending action."

[[errors]]
code = 4
label = "uninitialized_pool"
interpretation = "The lending pool account has not been initialized."

[[errors]]
code = 5
label = "uninitialized_oracle"
interpretation = "The oracle account has not been initialized."

[[errors]]
code = 6
label = "position_liquidated"
interpretation = "The position was already marked liquidated."

[[invariants]]
name = "no_bad_debt"
field = "bad_debt"
op = "=="
value = 0
