# Solend-fork lending adapter — Mango-shape oracle-pump replay variant.
#
# Identical to `fixtures/adapters/lending.toml` except for the trailing
# `[[invariants]]` block: this variant ships the slide-08-promised
# `oracle_bounds` invariant under the lending primitive's already-
# emitted `bad_debt` snapshot field. When the oracle's deviation
# permits a borrow that the post-revert price cannot sustain, the
# resulting liquidation cascade leaves a residual and the invariant
# fires.
#
# **Why a replay-specific adapter.** Adding `oracle_bounds` to the
# shipped `fixtures/adapters/lending.toml` would change the output
# shape of every lending run. The hero-grid hash and the
# `lending-whale-bad-debt` replay's canonical hash both depend on the
# shipping adapter staying clean. Keeping the addition replay-scoped
# preserves both hashes while satisfying the credibility claim.
#
# Historical inspiration: the October 2022 Mango Markets exploit
# (~$116M), in which the manipulator pumped MNGO/USDC perp price via
# self-trades on a thin order book; the on-chain oracle (which
# composed multi-source TWAPs) followed the inflated spot, and the
# manipulator borrowed against the now-overstated MNGO collateral
# before the price reverted. Mango v3 ran on Solana, but this pack
# does NOT replay Mango's mainnet bytecode or slot state — see
# README.md for the boundary. This is an economic-shape replay on
# Riptide's Solend-fork toy lending program: the oracle-trajectory
# realizes the pump and revert as two single-tick price moves, and
# the resulting underwater position lands real bad debt at
# liquidation.

protocol = "lending"

[instructions]
deposit   = { action = "deposit",   amount = "amount" }
borrow    = { action = "borrow",    amount = "amount" }
repay     = { action = "repay",     amount = "amount" }
withdraw  = { action = "withdraw",  amount = "amount" }
liquidate = { action = "liquidate", amount = "repay_amount" }

[state_mapping]
"pool.total_deposits" = "tvl"
"pool.total_borrows"  = "debt"
"pool.bad_debt"       = "bad_debt"
"position.collateral" = "collateral"
"position.debt"       = "debt"
"position.liquidated" = "liquidated"

[actions]

[observations]

[personas]

[[errors]]
code = 0
label = "invalid_account_owner"
interpretation = "An account was not owned by the expected lending program."

[[errors]]
code = 1
label = "invalid_account_data"
interpretation = "An account could not be decoded as the expected lending state."

[[errors]]
code = 2
label = "missing_oracle_account"
interpretation = "The instruction did not include the required oracle account."

[[errors]]
code = 3
label = "unauthorized"
interpretation = "The signer was not authorized for the requested lending action."

[[errors]]
code = 4
label = "uninitialized_pool"
interpretation = "The lending pool account has not been initialized."

[[errors]]
code = 5
label = "uninitialized_oracle"
interpretation = "The oracle account has not been initialized."

[[errors]]
code = 6
label = "position_liquidated"
interpretation = "The position was already marked liquidated."

[[invariants]]
name = "oracle_bounds"
field = "bad_debt"
op = "=="
value = 0
