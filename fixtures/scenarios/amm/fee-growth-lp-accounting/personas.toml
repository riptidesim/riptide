# Scenario-local persona notes for the fee-growth-lp-accounting smoke shape.
#
# AMM-lite exposes cumulative_fees and cumulative_volume, but the current
# committed price-impact run shows cumulative_fees remains a proxy field
# under this cold-run path. The catalog claim stays smoke-shape unless the
# cold result surfaces monotonic fee growth.

[personas.botter]
label = "Sustained-volume swapper"
action_rate_multiplier = 2.0
action_weights = { add_liquidity = 0.3, swap = 0.7 }
triggers = [
  { if = "pool.last_swap_price > 1010000", then = "swap", weight_boost = 1.8 },
]
persona_args = { amount_b = 500, direction = 1 }

[personas.grinder]
label = "LP fee account"
action_rate_multiplier = 1.0
action_weights = { add_liquidity = 0.55, swap = 0.45 }
triggers = [
  { if = "pool.reserve_a > 500000", then = "add_liquidity", weight_boost = 1.6 },
]
persona_args = { amount_b = 1000, direction = 0 }

[personas.casual]
label = "Baseline swapper"
action_rate_multiplier = 0.5
action_weights = { add_liquidity = 0.6, swap = 0.4 }
triggers = [
  { if = "pool.fee_bps < 100", then = "swap", weight_boost = 1.2 },
]
persona_args = { amount_b = 1500, direction = 0 }
