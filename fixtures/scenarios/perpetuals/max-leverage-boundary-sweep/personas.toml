# Scenario-local persona notes for the max-leverage-boundary-sweep smoke shape.
#
# The shipping perps adapter cold-runs deposit/withdraw only, so these
# persona IDs intentionally match the adapter's inline runtime personas.
# The catalog notes pin the boundary: open_position and true leverage
# sizing are not runtime-dispatchable from personas yet.

[personas.botter]
label = "Boundary pressure taker"
action_rate_multiplier = 2.0
action_weights = { deposit = 0.75, withdraw = 0.25 }
triggers = [
  { if = "position.collateral < 500", then = "deposit", weight_boost = 2.0 },
]

[personas.grinder]
label = "Collateral defender"
action_rate_multiplier = 1.0
action_weights = { deposit = 0.9, withdraw = 0.1 }
triggers = [
  { if = "market.max_leverage_bps > 0", then = "deposit", weight_boost = 1.3 },
]

[personas.casual]
label = "Passive margin account"
action_rate_multiplier = 0.5
action_weights = { deposit = 0.5, withdraw = 0.5 }
triggers = [
  { if = "position.collateral > 2000", then = "withdraw", weight_boost = 1.5 },
]
