# Scenario-local persona notes for the oracle-shock-liquidation-cascade smoke shape.
#
# The current perps cold-run surface has no runtime oracle shock or
# liquidate_position dispatch. The mix keeps higher-rate botter pressure
# while remaining compatible with the inline adapter persona IDs.

[personas.botter]
label = "Shock-sensitive taker"
action_rate_multiplier = 2.0
action_weights = { deposit = 0.7, withdraw = 0.3 }
triggers = [
  { if = "market.total_oi_long > 3000", then = "deposit", weight_boost = 1.6 },
]

[personas.grinder]
label = "Margin backstop"
action_rate_multiplier = 1.0
action_weights = { deposit = 0.9, withdraw = 0.1 }
triggers = [
  { if = "position.collateral < 500", then = "deposit", weight_boost = 2.2 },
]

[personas.casual]
label = "Passive margin account"
action_rate_multiplier = 0.5
action_weights = { deposit = 0.5, withdraw = 0.5 }
triggers = [
  { if = "position.collateral > 2000", then = "withdraw", weight_boost = 1.5 },
]
