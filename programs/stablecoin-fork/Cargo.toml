[package]
name = "stablecoin-fork"
version = "0.1.0"
edition = "2021"
description = "Minimal stablecoin fork — fifth protocol-class bundle. Collateral backing, stable supply, redemption queue, reserve buffer, and an authority-gated hedge-loss / NAV-haircut stress path that can push the system below full backing."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = "=0.10.4"
borsh-derive = "=0.10.4"
solana-program = "=1.18.26"
thiserror = "=1.0.69"

[features]
no-entrypoint = []

[workspace]

[patch.crates-io]
blake3 = { path = "../../vendor/blake3" }
borsh = { path = "../../vendor/borsh" }
borsh-derive = { path = "../../vendor/borsh-derive" }
cpufeatures = { path = "../../vendor/cpufeatures" }
