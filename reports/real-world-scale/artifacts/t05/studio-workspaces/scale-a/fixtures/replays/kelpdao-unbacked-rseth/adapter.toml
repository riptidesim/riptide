# Liquid-staking-fork adapter — KelpDAO unbacked-rsETH replay variant.
#
# Identical to `fixtures/adapters/liquid-staking.toml` except:
# - `[semantics]` is trimmed to a single `full_backing` invariant
#   (the slide-08-promised name) at severity `error`. The shipping
#   adapter declares the same algebra under
#   `lst_supply_backed_by_pool_rate` at severity `warn`; keeping that
#   firing surface clean here lets the test gate assert a single,
#   named invariant fires at the named tick.
# - personas are stripped (replay mode bypasses persona compilation).
#
# **Why a replay-specific adapter.** Adding `full_backing` to the
# shipped adapter (or bumping `lst_supply_backed_by_pool_rate` to
# `critical`) would change the firing surface for every liquid-staking
# scenario, drifting the depeg-redemption-run replay's pinned hash
# `5bdc5f7c7bd8bef8b1a350c76ebaa0b8fbfc3954d3b26882aa89ab54e9fda704`.
# Keeping the addition replay-scoped preserves both shipping
# determinism and this proof's named-invariant credibility claim.
#
# Historical inspiration: the June 2024 KelpDAO / rsETH bridge-trust
# failure where unbacked rsETH was minted into circulation and
# subsequently used as collateral in lending markets. KelpDAO is on
# Ethereum; this pack reproduces the *economic shape* on Riptide's
# Solana liquid-staking toy program. The toy program ships an admin
# `AdminMintLst` instruction that mirrors the unbacked-mint accounting
# flaw — see README.md for the full boundary.

protocol = "generic"
program_so = "../../../programs/liquid-staking/target/deploy/liquid_staking.so"
idl_path = "../../../fixtures/idls/liquid-staking.json"

[accounts.pool]
kind = "shared"
space = 121

[accounts.stake_account]
kind = "agent"
space = 97

[accounts.oracle]
kind = "shared"
space = 50
owner = { program_so = "../../../programs/admin_mock_oracle/target/deploy/admin_mock_oracle.so" }

[instructions]
stake           = { action = "stake",           amount = "amount" }
request_unstake = { action = "request_unstake", amount = "lst_amount" }
claim_unstake   = { action = "claim_unstake" }

[state_mapping]
"pool.total_assets"           = "pool.total_assets"
"pool.lst_supply"             = "pool.lst_supply"
"pool.reserve_buffer"         = "pool.reserve_buffer"
"pool.pending_unstake_assets" = "pool.pending_unstake_assets"
"pool.pending_unstake_count"  = "pool.pending_unstake_count"
"pool.exchange_rate_bps"      = "pool.exchange_rate_bps"
"pool.cumulative_slashed"     = "pool.cumulative_slashed"
"stake_account.lst_balance"              = "stake_account.lst_balance"
"stake_account.pending_unstake_assets"   = "stake_account.pending_unstake_assets"
"stake_account.claimable_assets"         = "stake_account.claimable_assets"
"stake_account.cumulative_claimed"       = "stake_account.cumulative_claimed"

[actions.stake]
label = "Stake underlying into the pool, mint LST"
takes = ["amount"]

[actions.request_unstake]
label = "Burn LST, post a redemption claim (covered from reserve or queued)"
takes = ["lst_amount"]

[actions.claim_unstake]
label = "Flush claimable and settle queued entries if reserve covers them"
takes = []

[observations]
"pool.total_assets"           = "uint"
"pool.lst_supply"             = "uint"
"pool.reserve_buffer"         = "uint"
"pool.pending_unstake_assets" = "uint"
"pool.pending_unstake_count"  = "uint"
"pool.exchange_rate_bps"      = "uint"
"pool.cumulative_slashed"     = "uint"
"stake_account.lst_balance"            = "uint"
"stake_account.pending_unstake_assets" = "uint"
"stake_account.claimable_assets"       = "uint"
"stake_account.cumulative_claimed"     = "uint"

[semantics]
class = "lst.v1"

[semantics.roles.pool]
source = "account.pool"
fields.total_assets = "u64"
fields.cumulative_slashed = "u64"

[semantics.roles.underlying_reserve]
source = "account.pool"
fields.reserve_buffer = "u64"

[semantics.roles.lst_mint]
source = "account.pool"
fields.lst_supply = "u64"

[semantics.roles.exchange_rate_config]
source = "account.pool"
fields.exchange_rate_bps = "u64"

[semantics.roles.withdrawal_queue]
source = "account.pool"
fields.pending_unstake_assets = "u64"
fields.pending_unstake_count = "u64"

[semantics.derived]
total_assets = "pool.total_assets"
lst_supply = "lst_mint.lst_supply"
exchange_rate = "exchange_rate_config.exchange_rate_bps"
reserve_buffer = "underlying_reserve.reserve_buffer"
withdrawal_queue_pressure = "withdrawal_queue.pending_unstake_assets * 10000 / max(total_assets, 1)"
claim_coverage_ratio = "reserve_buffer * 10000 / max(withdrawal_queue.pending_unstake_assets, 1)"
slash_loss_bps = "pool.cumulative_slashed * 10000 / max(total_assets + pool.cumulative_slashed, 1)"

[[semantics.invariants]]
name = "full_backing"
expr = "lst_supply * exchange_rate_config.exchange_rate_bps <= total_assets * 10000"
severity = "error"
description = "LST supply must not exceed underlying-asset backing at the stored exchange rate. Mirrors KelpDAO's rsETH unbacked-mint geometry."

[[oracles]]
name = "stake_price_feed"
kind = "admin-mock"
account = "oracle"
base_price = 1.0
exponent = -2

[personas.replay]
label = "Replay"
action_rate_multiplier = 0.0
action_weights = { stake = 0.0, request_unstake = 0.0, claim_unstake = 0.0 }
triggers = []
