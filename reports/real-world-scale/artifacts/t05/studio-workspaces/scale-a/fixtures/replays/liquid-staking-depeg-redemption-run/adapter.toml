# Liquid-staking-fork adapter — replay variant.
#
# Copy of `fixtures/adapters/liquid-staking.toml` trimmed to just
# the replay-load-bearing surface (accounts, state mapping, oracle
# binding, invariants). Personas are intentionally omitted because
# replay mode bypasses persona compilation — every instruction is
# dispatched directly from `trajectory.json`.
#
# **Why a replay-specific adapter.** Adding `no_queue_formation` to the
# shipped `fixtures/adapters/liquid-staking.toml` would change the
# output shape of every liquid-staking run (invariants_fired gains a
# row), which can drift the smoke gate for the shipped adapter. Keeping
# the invariant scoped to this replay fixture preserves the shipping
# adapter's hash while satisfying the credibility claim: the named
# proof fires a machine-checkable invariant at a named tick.
#
# The `riptide replay` CLI's replay-config JSON (at
# `fixtures/replays/liquid-staking-depeg-redemption-run/config.json`)
# points at this adapter directly; the replay-gate engine test loads
# it via `load_adapter(fixture_dir().join("adapter.toml"))`.

protocol = "generic"
program_so = "../../../programs/liquid-staking/target/deploy/liquid_staking.so"
idl_path = "../../../fixtures/idls/liquid-staking.json"

[accounts.pool]
kind = "shared"
space = 121

[accounts.stake_account]
kind = "agent"
space = 97

[accounts.oracle]
kind = "shared"
space = 50
owner = { program_so = "../../../programs/admin_mock_oracle/target/deploy/admin_mock_oracle.so" }

[instructions]
stake           = { action = "stake",           amount = "amount" }
request_unstake = { action = "request_unstake", amount = "lst_amount" }
claim_unstake   = { action = "claim_unstake" }

[state_mapping]
"pool.total_assets"           = "pool.total_assets"
"pool.lst_supply"             = "pool.lst_supply"
"pool.reserve_buffer"         = "pool.reserve_buffer"
"pool.pending_unstake_assets" = "pool.pending_unstake_assets"
"pool.pending_unstake_count"  = "pool.pending_unstake_count"
"pool.exchange_rate_bps"      = "pool.exchange_rate_bps"
"pool.cumulative_slashed"     = "pool.cumulative_slashed"
"stake_account.lst_balance"              = "stake_account.lst_balance"
"stake_account.pending_unstake_assets"   = "stake_account.pending_unstake_assets"
"stake_account.claimable_assets"         = "stake_account.claimable_assets"
"stake_account.cumulative_claimed"       = "stake_account.cumulative_claimed"

[actions.stake]
label = "Stake underlying into the pool, mint LST"
takes = ["amount"]

[actions.request_unstake]
label = "Burn LST, post a redemption claim (covered from reserve or queued)"
takes = ["lst_amount"]

[actions.claim_unstake]
label = "Flush claimable and settle queued entries if reserve covers them"
takes = []

[observations]
"pool.total_assets"           = "uint"
"pool.lst_supply"             = "uint"
"pool.reserve_buffer"         = "uint"
"pool.pending_unstake_assets" = "uint"
"pool.pending_unstake_count"  = "uint"
"pool.exchange_rate_bps"      = "uint"
"pool.cumulative_slashed"     = "uint"
"stake_account.lst_balance"            = "uint"
"stake_account.pending_unstake_assets" = "uint"
"stake_account.claimable_assets"       = "uint"
"stake_account.cumulative_claimed"     = "uint"

# `no_slash_during_healthy_run` — mirror of the shipping adapter's
# invariant. Fires on the first tick at or after the scheduled slash
# (`cumulative_slashed > 0`). Proves the depeg half of the claim.
#
# `no_queue_formation` — replay-scoped invariant. Fires on the first
# tick where the withdrawal queue accumulates a non-zero account count
# (`pool.pending_unstake_count > 0`). Proves the redemption-run half of
# the claim. Scoped to the replay fixture so the shipping adapter's
# one-tick boot gate stays free of queue-related firings on the
# smoke-personas path.

[[invariants]]
name = "no_slash_during_healthy_run"
field = "pool.cumulative_slashed"
op = "=="
value = 0

[[invariants]]
name = "no_queue_formation"
field = "pool.pending_unstake_count"
op = "=="
value = 0

[[oracles]]
name = "stake_price_feed"
kind = "admin-mock"
account = "oracle"
base_price = 1.0
exponent = -2

# Replay mode bypasses persona compilation, but the generic adapter
# loader still requires at least one declared persona. Ship a single
# `replay` persona with zero action weights — every instruction the
# replay dispatches comes from `trajectory.json`, never from a
# persona-side weight draw.
[personas.replay]
label = "Replay"
action_rate_multiplier = 0.0
action_weights = { stake = 0.0, request_unstake = 0.0, claim_unstake = 0.0 }
triggers = []
