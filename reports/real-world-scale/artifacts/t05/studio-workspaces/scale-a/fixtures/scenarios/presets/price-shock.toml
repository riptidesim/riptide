# price-shock scenario preset
#
# Declarative form of the legacy hardcoded `PriceShockScenario::new(
# base_price = 100.0,
# noise_bps = 25,
# shock_tick = (run_config.ticks / 2).max(1),
# drop = 0.4 // overridable via RIPTIDE_PRICE_SHOCK_DROP
# )` call site that used to live in `engine/src/main.rs`.
#
# Field mapping:
# name -> engine dispatch key (matches `run_config.scenario`)
# kind -> discriminant; selects the Rust `Scenario` impl
# base_price -> PriceShockScenario::new #1
# noise_bps -> PriceShockScenario::new #2
# shock_tick_denominator -> PriceShockScenario::new #3 is derived at runtime
# as `(run_config.ticks / denominator).max(1)`.
# A value of 2 preserves the legacy `ticks / 2` behavior.
# drop_percent -> PriceShockScenario::new #4 (may be overridden
# by the `RIPTIDE_PRICE_SHOCK_DROP` env var).
#
# Byte-identical constraint: changing any field here changes the
# determinism reference hash `5a5f6744…`. Treat as a sealed fixture.

name = "price-shock"
kind = "price_shock"
base_price = 100.0
noise_bps = 25
shock_tick_denominator = 2
drop_percent = 0.4
