# AMM persona — liquidity provider.
#
#. Standalone TOML fragment that the sidecar script
# `scripts/amm-scratch.sh` concatenates onto a truncated copy
# of `fixtures/adapters/amm.toml` below the `# === SIDECAR-CUT ===`
# marker.
#
# Adds liquidity when reserves look healthy; pulls some back when the
# pool's k has grown far beyond the initial seed (a proxy for "fees
# accrued enough to take profits"). `direction = 0` is irrelevant for
# this persona — swap weight is zero — but the multi-arg builder still
# requires it at encode time.
[personas.lp-provider]
label = "Liquidity provider"
action_rate_multiplier = 1.0
action_weights = { add_liquidity = 0.8, swap = 0.0, remove_liquidity = 0.2 }
triggers = [
  { if = "pool.reserve_a > 500000", then = "add_liquidity", weight_boost = 2.0 },
  { if = "pool.cumulative_fees > 1000", then = "remove_liquidity", weight_boost = 1.5 },
]
persona_args = { amount_b = 1000, direction = 0 }
