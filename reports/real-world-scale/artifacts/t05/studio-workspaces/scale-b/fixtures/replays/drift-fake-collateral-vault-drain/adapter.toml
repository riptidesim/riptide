# Solend-fork lending adapter — Drift-shape fake-collateral replay variant.
#
# Identical to `fixtures/adapters/lending.toml` except for the trailing
# `[[invariants]]` block: this variant ships a `collateral_backing`
# invariant under the lending primitive's already-emitted `bad_debt`
# snapshot field. When accepted collateral is valued far above its
# realized backing, the resulting liquidation leaves a residual and
# the invariant fires.
#
# **Why a replay-specific adapter.** Adding `collateral_backing` to the
# shipped `fixtures/adapters/lending.toml` would change the output
# shape of every lending run. The hero-grid hash and the
# `lending-whale-bad-debt` replay's canonical hash both depend on the
# shipping adapter staying clean. Keeping the addition replay-scoped
# preserves both hashes while satisfying the credibility claim.
#
# Historical inspiration: the April 2026 Drift incident, where the
# primary compromise was off-chain/privileged control but the on-chain
# loss path included fake or mispriced collateral being treated as
# borrowable value. Drift runs on Solana, but this pack does NOT replay
# Drift's mainnet bytecode, admin-control surface, oracle accounts, or
# slot state. This is an economic-shape replay on Riptide's
# Solend-fork toy lending program: the oracle trajectory realizes the
# accepted-collateral mark and collapse as declared ticks, and the
# resulting underwater position lands real bad debt at liquidation.

protocol = "lending"

[instructions]
deposit   = { action = "deposit",   amount = "amount" }
borrow    = { action = "borrow",    amount = "amount" }
repay     = { action = "repay",     amount = "amount" }
withdraw  = { action = "withdraw",  amount = "amount" }
liquidate = { action = "liquidate", amount = "repay_amount" }

[state_mapping]
"pool.total_deposits" = "tvl"
"pool.total_borrows"  = "debt"
"pool.bad_debt"       = "bad_debt"
"position.collateral" = "collateral"
"position.debt"       = "debt"
"position.liquidated" = "liquidated"

[actions]

[observations]

[personas]

[[errors]]
code = 0
label = "invalid_account_owner"
interpretation = "An account was not owned by the expected lending program."

[[errors]]
code = 1
label = "invalid_account_data"
interpretation = "An account could not be decoded as the expected lending state."

[[errors]]
code = 2
label = "missing_oracle_account"
interpretation = "The instruction did not include the required oracle account."

[[errors]]
code = 3
label = "unauthorized"
interpretation = "The signer was not authorized for the requested lending action."

[[errors]]
code = 4
label = "uninitialized_pool"
interpretation = "The lending pool account has not been initialized."

[[errors]]
code = 5
label = "uninitialized_oracle"
interpretation = "The oracle account has not been initialized."

[[errors]]
code = 6
label = "position_liquidated"
interpretation = "The position was already marked liquidated."

[[invariants]]
name = "collateral_backing"
field = "bad_debt"
op = "=="
value = 0
