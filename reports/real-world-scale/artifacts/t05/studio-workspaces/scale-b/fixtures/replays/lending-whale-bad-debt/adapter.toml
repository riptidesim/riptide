# Solend-fork lending adapter — replay variant.
#
# Identical to `fixtures/adapters/lending.toml` except for the
# trailing `[[invariants]]` block: this variant ships the `no_bad_debt`
# invariant so the whale-bad-debt replay can prove "bad_debt
# invariant fires at the expected tick" on a CI gate, rather than only
# showing bad-debt accrual as a summary number.
#
# **Why a replay-specific adapter.** Adding this invariant to the
# shipped `fixtures/adapters/lending.toml` would change the output
# shape of every lending run (invariants_fired gains a row), which
# breaks the hero grid determinism hash
# `89ca84209f3423c317e6be96f14261a9ebed7a9668398a08087a25631b782a11`
# for the `w25-s40` cell — that cell specifically produces bad debt,
# so the invariant would fire there too and the canonical summary
# would diverge. Keeping the invariant scoped to the replay fixture
# preserves the hero grid hash while satisfying the replay-level claim that
# the `bad_debt` invariant fires at the expected tick.
#
# The `riptide replay` CLI's replay-config JSON (at
# `fixtures/replays/lending-whale-bad-debt/config.json`) points at
# this adapter directly; engine test `replay_lending_whale_bad_debt.rs`
# loads it via `load_adapter(fixture_dir().join("adapter.toml"))`.

protocol = "lending"

[instructions]
deposit   = { action = "deposit",   amount = "amount" }
borrow    = { action = "borrow",    amount = "amount" }
repay     = { action = "repay",     amount = "amount" }
withdraw  = { action = "withdraw",  amount = "amount" }
liquidate = { action = "liquidate", amount = "repay_amount" }

[state_mapping]
"pool.total_deposits" = "tvl"
"pool.total_borrows"  = "debt"
"pool.bad_debt"       = "bad_debt"
"position.collateral" = "collateral"
"position.debt"       = "debt"
"position.liquidated" = "liquidated"

[actions]

[observations]

[personas]

[[errors]]
code = 0
label = "invalid_account_owner"
interpretation = "An account was not owned by the expected lending program."

[[errors]]
code = 1
label = "invalid_account_data"
interpretation = "An account could not be decoded as the expected lending state."

[[errors]]
code = 2
label = "missing_oracle_account"
interpretation = "The instruction did not include the required oracle account."

[[errors]]
code = 3
label = "unauthorized"
interpretation = "The signer was not authorized for the requested lending action."

[[errors]]
code = 4
label = "uninitialized_pool"
interpretation = "The lending pool account has not been initialized."

[[errors]]
code = 5
label = "uninitialized_oracle"
interpretation = "The oracle account has not been initialized."

[[errors]]
code = 6
label = "position_liquidated"
interpretation = "The position has already been liquidated."

[[errors]]
code = 7
label = "position_healthy"
interpretation = "The position is healthy and cannot be liquidated."

[[errors]]
code = 8
label = "insufficient_collateral"
interpretation = "Borrow or withdraw exceeded the position collateral constraint."

[[errors]]
code = 9
label = "insufficient_liquidity"
interpretation = "The pool does not have enough available liquidity."

[[errors]]
code = 10
label = "deposit_limit_exceeded"
interpretation = "The deposit would exceed the pool deposit limit."

[[errors]]
code = 11
label = "borrow_limit_exceeded"
interpretation = "The borrow would exceed the pool borrow limit."

[[errors]]
code = 12
label = "math_overflow"
interpretation = "The lending program hit a checked arithmetic overflow."

# credibility invariant. Reads `cumulative_bad_debt` through the
# lending-side observation alias (`bad_debt` in this adapter). Passes
# at tick 0 (cumulative_bad_debt = 0 after bootstrap deposits, pre any
# liquidation) and through tick 3; fires at tick 4 when the replay's
# terminal liquidation cascade realizes bad_debt > 0. The replay gate
# asserts both the firing count and the firing tick.
[[invariants]]
name = "no_bad_debt"
field = "bad_debt"
op = "=="
value = 0
