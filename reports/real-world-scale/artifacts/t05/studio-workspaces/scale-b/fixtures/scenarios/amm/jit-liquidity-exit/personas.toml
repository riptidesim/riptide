# Scenario-local persona notes for the jit-liquidity-exit smoke shape.
#
# The current AMM cold-run surface supports add_liquidity and swap, while
# the inline smoke persona set avoids remove_liquidity because first-touch
# LP-share availability is not modeled as a JIT strategy. The catalog
# notes pin this as deterministic shape only.

[personas.botter]
label = "Large swap taker"
action_rate_multiplier = 2.0
action_weights = { add_liquidity = 0.25, swap = 0.75 }
triggers = [
  { if = "pool.last_swap_price > 1010000", then = "swap", weight_boost = 1.8 },
]
persona_args = { amount_b = 500, direction = 1 }

[personas.grinder]
label = "LP depth provider"
action_rate_multiplier = 1.0
action_weights = { add_liquidity = 0.7, swap = 0.3 }
triggers = [
  { if = "pool.reserve_a > 500000", then = "add_liquidity", weight_boost = 1.6 },
]
persona_args = { amount_b = 1000, direction = 0 }

[personas.casual]
label = "Baseline swapper"
action_rate_multiplier = 0.5
action_weights = { add_liquidity = 0.6, swap = 0.4 }
triggers = [
  { if = "pool.fee_bps < 100", then = "swap", weight_boost = 1.2 },
]
persona_args = { amount_b = 1500, direction = 0 }
