# Riptide public scenario-family catalog.
#
# Schema v1:
# - [meta].version must be 1.
# - Each [[family]] slug is <class>/<family-slug>, kebab-case, and unique.
# - class is one of: lending, stablecoin, liquid-staking, perpetuals, amm.
# - fixture_path is relative to the repo root and points at the matching
#   fixtures/scenarios/<class>/<family-slug> directory.
# - claim_level is one of: smoke-shape, stress, failure-shape.
# - result_hash is the sha256 of the committed simulation-result.json file.

