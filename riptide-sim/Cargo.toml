[package]
name = "riptide-sim"
version = "0.10.0"
edition = "2021"
description = "Guided Rust simulation API for Riptide project-owned protocol flows."
license = "MIT OR Apache-2.0"
repository = "https://github.com/riptidesim/riptide"
publish = false

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = { version = "1.6.1", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive", "env", "unicode"] }
litesvm = "0.11.0"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
riptide-sim-macros = { path = "../riptide-sim-macros" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
solana-account = "3.2.0"
solana-clock = "3.0.1"
solana-loader-v3-interface = "6.1.1"
solana-sdk = "4.0.1"
solana-sysvar = "3.1.1"
solana-sysvar-id = "3.1.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = "3.1.0"
toml = "1.1.2"
